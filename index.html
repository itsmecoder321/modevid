<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Avatar Keyframer</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --panel-bg: #ffffff; --text-color: #333333;
            --border-color: #cccccc; --accent-color: #007bff; --accent-hover: #0056b3;
            --danger-color: #dc3545; --section-bg: #eef2f5; --block-bg: #e0f0ff;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --border-color: #333333; --accent-color: #3f51b5; --accent-hover: #2c387e;
            --section-bg: #252525; --block-bg: #1e3a5f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar {
            width: 480px; min-width: 480px; background-color: var(--panel-bg); 
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10;
        }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; color: var(--text-color); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; font-size: 0.9em; }
        .tab-btn.active { border-bottom: 3px solid var(--accent-color); color: var(--accent-color); background: var(--section-bg); }
        .tab-btn:hover { background: var(--section-bg); }

        .tab-content { padding: 15px; overflow-y: auto; flex-grow: 1; display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .panel-section { background: var(--section-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        
        label { font-size: 0.85em; font-weight: bold; }
        .sub-label { font-size: 0.7em; color: gray; font-weight: normal; margin-top:-3px; }
        
        input[type="file"], input[type="color"], input[type="number"], select {
            width: 100%; padding: 6px; background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85em;
        }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent-color); }
        
        button { padding: 8px; border: none; border-radius: 4px; background-color: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9em; }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.6; }
        
        #btnRecord { background-color: var(--danger-color); margin-top: 5px; }
        #btnCenter { background-color: #28a745; margin-bottom: 5px; }
        
        /* Audio Player Bar */
        .audio-player-box { background: var(--section-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); margin-bottom: 10px; }
        .audio-times { display: flex; justify-content: space-between; font-size: 0.75em; color: gray; font-family: monospace; margin-top: 4px; }

        /* Timeline Blocks UI */
        #timelineList { display: flex; flex-direction: column; gap: 6px; margin-top: 5px; max-height: 200px; overflow-y: auto; padding-right: 5px; }
        .tl-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; transition: 0.2s; }
        .tl-item.editing { border-left: 4px solid var(--danger-color); background: var(--block-bg); }
        
        .tl-actions { display: flex; gap: 5px; }
        .tl-btn { padding: 4px 8px; font-size: 0.8em; border-radius: 3px; border: none; font-weight: bold; cursor: pointer; }
        .tl-edit { background: var(--accent-color); color: white; }
        .tl-delete { background: var(--danger-color); color: white; }

        /* Pose Editor */
        #poseEditorPanel { display: none; border-top: 2px dashed var(--danger-color); padding-top: 10px; margin-top: 5px; }
        #poseEditorPanel.active { display: flex; flex-direction: column; gap: 8px; }

        #diagnostics { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.75em; max-height: 80px; overflow-y: auto; }
        .success { color: #28a745; font-weight:bold; } .warning { color: #ffc107; font-weight:bold; } .error { color: #dc3545; font-weight:bold; }
        
        #main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; background-color: var(--bg-color); }
        #canvas-container { position: relative; background-color: #00ff00; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; z-index: 100; padding: 6px 12px; font-size: 0.8em; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div id="sidebar">
        <!-- Persistent Audio Player -->
        <div style="padding: 15px 15px 0 15px;">
            <div class="audio-player-box">
                <div class="control-group">
                    <label>Audio Scrubber</label>
                    <input type="range" id="audioSeek" min="0" max="0" step="0.01" value="0" disabled>
                    <div class="audio-times">
                        <span id="timeCurrent">0.0s</span>
                        <span id="timeTotal">0.0s</span>
                    </div>
                </div>
                <button id="btnPlayPause" disabled style="width: 100%; margin-top: 8px;">Play / Pause Timeline</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-target="tab-setup">1. Model & Scene</button>
            <button class="tab-btn" data-target="tab-timeline">2. Timeline & Poses</button>
        </div>

        <!-- TAB 1: SETUP -->
        <div id="tab-setup" class="tab-content active">
            <div class="control-group">
                <label>Load 3D Model (.glb)</label>
                <input type="file" id="glbInput" accept=".glb">
            </div>
            <div id="diagnostics"><div id="model-info">Upload a model to initialize...</div></div>
            <div class="control-group">
                <label>Load Audio Speech</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>

            <!-- Positioning -->
            <div class="panel-section">
                <label style="color: var(--accent-color);">Framing & Positioning</label>
                <button id="btnCenter" disabled>🎯 Auto Center & Fit</button>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Scale</label><input type="range" id="modScale" min="0.1" max="5" step="0.05" value="1"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Up / Down</label><input type="range" id="modPosY" min="-5" max="5" step="0.1" value="0"></div>
                </div>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left / Right</label><input type="range" id="modPosX" min="-5" max="5" step="0.1" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Near / Far</label><input type="range" id="modPosZ" min="-5" max="5" step="0.1" value="0"></div>
                </div>
            </div>

            <!-- Overrides -->
            <div class="panel-section" style="margin-top: auto;">
                <label style="color: var(--accent-color);">Life Overrides & Export</label>
                <div class="row-group">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Lip Sync Intensity</label><input type="range" id="mouthAmp" min="0" max="2" step="0.05" value="0.8"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Body Sway (Breath)</label><input type="range" id="animSway" min="0" max="2" step="0.1" value="1.0"></div>
                </div>
                <div class="row-group" style="margin-top: 5px;">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Background</label><input type="color" id="bgColor" value="#00ff00"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Format</label>
                        <select id="resolution">
                            <option value="landscape">16:9 (HD)</option><option value="portrait">9:16 (Shorts)</option>
                        </select>
                    </div>
                </div>
                <button id="btnRecord" disabled style="margin-top: 8px;">Record & Export Video</button>
            </div>
        </div>

        <!-- TAB 2: TIMELINE & POSE EDITOR -->
        <div id="tab-timeline" class="tab-content">
            
            <div class="panel-section" style="background-color: #e8f4fd; border-color: #b8daff;">
                <label style="color: var(--accent-color);">➕ Add Animation Block</label>
                <div class="row-group">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Start (s)</label><input type="number" id="tlStart" min="0" step="0.1" value="0.0"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">End (s)</label><input type="number" id="tlEnd" min="0.1" step="0.1" value="3.0"></div>
                </div>
                <div class="row-group" style="margin-top: 5px;">
                    <div class="control-group" style="flex: 2;">
                        <label class="sub-label">Select Preset Pose</label>
                        <select id="tlPreset">
                            <option value="explain_both">Explain (Both Hands)</option>
                            <option value="explain_right">Explain (Right Hand)</option>
                            <option value="explain_left">Explain (Left Hand)</option>
                            <option value="thinking">Thinking (Hand on Chin)</option>
                            <option value="hands_hips">Hands on Hips</option>
                        </select>
                    </div>
                    <button id="btnAddBlock" style="flex: 1; margin-top: auto;">Add Block</button>
                </div>
            </div>

            <div class="panel-section">
                <label style="color: var(--accent-color);">Timeline Tracks</label>
                <div style="font-size:0.7em; color:gray;">Click 'Tune' to fix clipping for a specific block. Gaps will automatically return to Resting Pose.</div>
                <div id="timelineList">
                    <!-- Blocks go here -->
                </div>
            </div>

            <!-- DYNAMIC POSE TUNER (Hidden until Edit is clicked) -->
            <div id="poseEditorPanel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="color: var(--danger-color);">Tuning Block: <span id="editBlockLabel">0.0s - 3.0s</span></label>
                    <button id="btnDoneEdit" style="background:var(--text-color); padding:4px 8px;">Done</button>
                </div>
                <div style="font-size:0.7em; color:gray; margin-bottom:5px;">Adjust sliders to fix clipping for this specific timeline block.</div>
                
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left Arm Fwd/Back</label><input type="range" class="pose-slider" id="lAP" data-key="lAP" min="-2.5" max="2.5" step="0.05" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Right Arm Fwd/Back</label><input type="range" class="pose-slider" id="rAP" data-key="rAP" min="-2.5" max="2.5" step="0.05" value="0"></div>
                </div>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left Arm Out/In</label><input type="range" class="pose-slider" id="lAR" data-key="lAR" min="-2.5" max="2.5" step="0.05" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Right Arm Out/In</label><input type="range" class="pose-slider" id="rAR" data-key="rAR" min="-2.5" max="2.5" step="0.05" value="0"></div>
                </div>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left Elbow Bend</label><input type="range" class="pose-slider" id="lFP" data-key="lFP" min="-2.8" max="2.8" step="0.05" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Right Elbow Bend</label><input type="range" class="pose-slider" id="rFP" data-key="rFP" min="-2.8" max="2.8" step="0.05" value="0"></div>
                </div>
            </div>

        </div>
    </div>

    <div id="main-content">
        <button class="theme-toggle" id="btnTheme">Toggle Theme</button>
        <div id="canvas-container"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- PRESET POSE LIBRARY (16 Axis Coordinates) ---
        // P=Pitch, R=Roll, Y=Yaw
        const BaseRest = { lSP:0, lSR:0, lAP:0.1, lAR:0.15, lFP:0.1, lFY:0, lHP:0, lHR:0, rSP:0, rSR:0, rAP:0.1, rAR:0.15, rFP:0.1, rFY:0, rHP:0, rHR:0 };
        
        const PoseLibrary = {
            explain_both: { ...BaseRest, lSP:0.15, lAP:0.6, lAR:0.3, lFP:1.5, lFY:0.3, lHP:-0.2, rSP:0.15, rAP:0.6, rAR:0.3, rFP:1.5, rFY:-0.3, rHP:-0.2 },
            explain_right: { ...BaseRest, rSP:0.15, rAP:0.6, rAR:0.3, rFP:1.5, rFY:-0.3, rHP:-0.2 },
            explain_left: { ...BaseRest, lSP:0.15, lAP:0.6, lAR:0.3, lFP:1.5, lFY:0.3, lHP:-0.2 },
            thinking: { ...BaseRest, rSP:0.1, rAP:0.8, rAR:-0.1, rFP:2.1, rFY:-0.5, rHP:-0.1 },
            hands_hips: { ...BaseRest, lAP:0.2, lAR:0.5, lFP:1.0, lFY:0.8, lHP:-0.4, rAP:0.2, rAR:0.5, rFP:1.0, rFY:-0.8, rHP:-0.4 }
        };

        const state = {
            isPlaying: false, isRecording: false, resolution: { w: 1920, h: 1080 },
            morphMeshes: [], bones: {}, initialBones: {},
            time: 0, audioTime: 0, audioDuration: 0, speechEnergy: 0,
            eyeTarget: new THREE.Vector2(0, 0), currentEyePos: new THREE.Vector2(0, 0), nextSaccadeTime: 0,
            blinkTimer: 0, nextBlinkTime: 2.0, isBlinkingNow: 0,
            
            // KEYFRAME ENGINE
            blocks: [], // { id, start, end, label, customPose }
            editingBlockId: null,
            smoothPose: { ...BaseRest } // The actual values applied to bones every frame
        };

        const ui = {
            glb: document.getElementById('glbInput'), audio: document.getElementById('audioInput'),
            bg: document.getElementById('bgColor'), res: document.getElementById('resolution'),
            play: document.getElementById('btnPlayPause'), rec: document.getElementById('btnRecord'),
            centerBtn: document.getElementById('btnCenter'), theme: document.getElementById('btnTheme'),
            container: document.getElementById('canvas-container'), info: document.getElementById('model-info'),
            mouthAmp: document.getElementById('mouthAmp'), animSway: document.getElementById('animSway'),
            scale: document.getElementById('modScale'), posX: document.getElementById('modPosX'), posY: document.getElementById('modPosY'), posZ: document.getElementById('modPosZ'),
            
            audioSeek: document.getElementById('audioSeek'), timeCur: document.getElementById('timeCurrent'), timeTot: document.getElementById('timeTotal'),
            
            // Timeline UI
            tlStart: document.getElementById('tlStart'), tlEnd: document.getElementById('tlEnd'), tlPreset: document.getElementById('tlPreset'),
            btnAddBlock: document.getElementById('btnAddBlock'), tlList: document.getElementById('timelineList'),
            tabs: document.querySelectorAll('.tab-btn'), tabContents: document.querySelectorAll('.tab-content'),
            
            // Pose Editor UI
            editorPanel: document.getElementById('poseEditorPanel'), btnDoneEdit: document.getElementById('btnDoneEdit'),
            editLabel: document.getElementById('editBlockLabel'), poseSliders: document.querySelectorAll('.pose-slider')
        };

        // --- TABS LOGIC ---
        ui.tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                ui.tabs.forEach(t => t.classList.remove('active'));
                ui.tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // --- TIMELINE MANAGEMENT ---
        function renderTimeline() {
            state.blocks.sort((a, b) => a.start - b.start);
            ui.tlList.innerHTML = '';
            
            if (state.blocks.length === 0) {
                ui.tlList.innerHTML = '<div style="font-size:0.8em; color:gray;">Timeline is empty. Avatar will remain in resting pose.</div>';
            }

            state.blocks.forEach(block => {
                const div = document.createElement('div');
                const isEditing = state.editingBlockId === block.id;
                div.className = `tl-item ${isEditing ? 'editing' : ''}`;
                div.innerHTML = `<span>[${block.start.toFixed(1)}s - ${block.end.toFixed(1)}s] <b>${block.label}</b></span>`;
                
                const actions = document.createElement('div');
                actions.className = 'tl-actions';
                
                const btnEdit = document.createElement('button');
                btnEdit.className = 'tl-btn tl-edit'; btnEdit.innerText = 'Tune';
                btnEdit.onclick = () => openPoseEditor(block.id);
                
                const btnDel = document.createElement('button');
                btnDel.className = 'tl-btn tl-delete'; btnDel.innerText = 'X';
                btnDel.onclick = () => {
                    state.blocks = state.blocks.filter(b => b.id !== block.id);
                    if (state.editingBlockId === block.id) closePoseEditor();
                    renderTimeline();
                };

                actions.appendChild(btnEdit); actions.appendChild(btnDel);
                div.appendChild(actions);
                ui.tlList.appendChild(div);
            });
        }

        ui.btnAddBlock.addEventListener('click', () => {
            const start = parseFloat(ui.tlStart.value);
            const end = parseFloat(ui.tlEnd.value);
            if (start >= end) { alert("End time must be greater than Start time."); return; }
            
            const presetId = ui.tlPreset.value;
            const label = ui.tlPreset.options[ui.tlPreset.selectedIndex].text;
            
            // Clone the preset so it can be edited safely
            const customPose = { ...PoseLibrary[presetId] };
            
            state.blocks.push({ id: Date.now(), start, end, label, customPose });
            
            // Auto increment UI for next block
            ui.tlStart.value = end.toFixed(1);
            ui.tlEnd.value = (end + 3.0).toFixed(1);
            
            renderTimeline();
        });

        // --- POSE EDITOR LOGIC ---
        function openPoseEditor(blockId) {
            state.editingBlockId = blockId;
            const block = state.blocks.find(b => b.id === blockId);
            if (!block) return;
            
            ui.editLabel.innerText = `${block.start.toFixed(1)}s - ${block.end.toFixed(1)}s (${block.label})`;
            ui.editorPanel.classList.add('active');
            
            // Populate sliders with block's custom data
            ui.poseSliders.forEach(slider => {
                const key = slider.getAttribute('data-key');
                slider.value = block.customPose[key];
            });
            
            // Scrub audio to the middle of this block so user sees what they are editing
            const midTime = block.start + ((block.end - block.start) / 2);
            seekAudio(midTime);
            
            renderTimeline();
        }

        function closePoseEditor() {
            state.editingBlockId = null;
            ui.editorPanel.classList.remove('active');
            renderTimeline();
        }
        ui.btnDoneEdit.addEventListener('click', closePoseEditor);

        ui.poseSliders.forEach(slider => {
            slider.addEventListener('input', (e) => {
                if (!state.editingBlockId) return;
                const block = state.blocks.find(b => b.id === state.editingBlockId);
                if (block) {
                    const key = e.target.getAttribute('data-key');
                    block.customPose[key] = parseFloat(e.target.value);
                    // Force the smoothing engine to update instantly while scrubbing
                    state.smoothPose[key] = block.customPose[key];
                }
            });
        });

        // --- AUDIO ENGINE ---
        function seekAudio(time) {
            state.audioTime = time;
            ui.audioSeek.value = time;
            ui.timeCur.innerText = time.toFixed(1) + 's';
            if (state.isPlaying) playAudioAt(time);
        }

        ui.audioSeek.addEventListener('input', (e) => { seekAudio(parseFloat(e.target.value)); });

        // --- THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(ui.bg.value);
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        const camera = new THREE.PerspectiveCamera(45, state.resolution.w / state.resolution.h, 0.01, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(state.resolution.w, state.resolution.h);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        ui.container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const keyLight = new THREE.DirectionalLight(0xfffaf0, 2.2);
        keyLight.position.set(5, 5, 5); keyLight.castShadow = true;
        scene.add(keyLight);
        scene.add(new THREE.DirectionalLight(0xd0e0ff, 1.0)).position.set(-5, 3, 3);

        let currentModel = null, audioContext, analyser, audioBuffer, mediaStreamDest, dataArray, sourceNode, startTime = 0;

        function resize() {
            const parent = ui.container.parentElement;
            const aspect = state.resolution.w / state.resolution.h;
            if (parent.clientWidth / parent.clientHeight > aspect) {
                ui.container.style.height = '88vh'; ui.container.style.width = `calc(88vh * ${aspect})`;
            } else {
                ui.container.style.width = '88vw'; ui.container.style.height = `calc(88vw / ${aspect})`;
            }
            camera.aspect = aspect; camera.updateProjectionMatrix();
            renderer.setSize(state.resolution.w, state.resolution.h);
        }
        window.addEventListener('resize', resize); resize();
        ui.res.addEventListener('change', e => { state.resolution = e.target.value === 'landscape' ? {w:1920, h:1080} : {w:1080, h:1920}; resize(); });
        ui.bg.addEventListener('input', e => scene.background.set(e.target.value));

        function centerAndFitModel() {
            if (!currentModel) return;
            ui.scale.value = 1; ui.posX.value = 0; ui.posY.value = 0; ui.posZ.value = 0;
            modelGroup.scale.set(1, 1, 1); modelGroup.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim === 0) return;

            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.4;
            camera.position.set(center.x, center.y + (size.y * 0.1), center.z + cameraZ);
            controls.target.set(center.x, center.y + (size.y * 0.2), center.z);
            camera.far = cameraZ * 10; camera.updateProjectionMatrix(); controls.update();
        }
        ui.centerBtn.addEventListener('click', centerAndFitModel);

        ui.glb.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            ui.info.innerHTML = "Parsing Model & Extracting Skeleton...";
            
            const url = window.URL.createObjectURL(file);
            new GLTFLoader().load(url, gltf => {
                if (currentModel) modelGroup.remove(currentModel);
                currentModel = gltf.scene;
                modelGroup.add(currentModel);
                
                state.morphMeshes = []; state.bones = {}; state.initialBones = {};
                let blendshapeCount = 0;
                
                currentModel.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        if (node.morphTargetDictionary) {
                            state.morphMeshes.push(node);
                            blendshapeCount += Object.keys(node.morphTargetDictionary).length;
                        }
                    }
                    if (node.isBone) {
                        const n = node.name.toLowerCase();
                        if (n.includes('hips') || n.includes('pelvis')) state.bones.hips = node;
                        else if (n.includes('spine2') || n.includes('chest')) state.bones.chest = node;
                        else if (n.includes('spine') && !n.includes('1') && !n.includes('2')) state.bones.spine = node;
                        else if (n.includes('neck')) state.bones.neck = node;
                        else if (n.includes('head') && !n.includes('top')) state.bones.head = node;
                        else if (n.includes('leftshoulder') || n.includes('shoulder_l') || n.includes('clavicle_l')) state.bones.lShoulder = node;
                        else if (n.includes('rightshoulder') || n.includes('shoulder_r') || n.includes('clavicle_r')) state.bones.rShoulder = node;
                        else if (n.includes('leftarm') || n.includes('arm_l') || n.includes('upperarm_l')) state.bones.lArm = node;
                        else if (n.includes('rightarm') || n.includes('arm_r') || n.includes('upperarm_r')) state.bones.rArm = node;
                        else if (n.includes('leftforearm') || n.includes('forearm_l') || n.includes('elbow_l')) state.bones.lFore = node;
                        else if (n.includes('rightforearm') || n.includes('forearm_r') || n.includes('elbow_r')) state.bones.rFore = node;
                        else if (n.includes('lefthand') || n.includes('hand_l') || n.includes('wrist_l')) state.bones.lHand = node;
                        else if (n.includes('righthand') || n.includes('hand_r') || n.includes('wrist_r')) state.bones.rHand = node;
                        else if (n.includes('lefteye') || n.includes('eye_l')) state.bones.lEye = node;
                        else if (n.includes('righteye') || n.includes('eye_r')) state.bones.rEye = node;

                        state.initialBones[node.name] = { q: node.quaternion.clone(), p: node.position.clone() };
                    }
                });

                ui.info.innerHTML = `<span class="success">Rig Active! Model Ready.</span>`;
                ui.centerBtn.disabled = false; centerAndFitModel();
                if(audioBuffer) ui.rec.disabled = false;
                window.URL.revokeObjectURL(url);
            });
        });

        ui.audio.addEventListener('change', async e => {
            const arrayBuffer = await e.target.files[0].arrayBuffer();
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.decodeAudioData(arrayBuffer, buffer => {
                audioBuffer = buffer; 
                state.audioDuration = buffer.duration;
                ui.audioSeek.max = state.audioDuration;
                ui.audioSeek.disabled = false;
                ui.timeTot.innerText = state.audioDuration.toFixed(1) + 's';
                
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                mediaStreamDest = audioContext.createMediaStreamDestination();
                ui.play.disabled = false; if(currentModel) ui.rec.disabled = false;
            });
        });

        function playAudioAt(offset) {
            if (sourceNode) { sourceNode.stop(); sourceNode.disconnect(); }
            sourceNode = audioContext.createBufferSource(); 
            sourceNode.buffer = audioBuffer;
            sourceNode.connect(analyser); analyser.connect(audioContext.destination); analyser.connect(mediaStreamDest);
            
            startTime = audioContext.currentTime - offset; 
            sourceNode.start(0, offset);
            state.isPlaying = true; 
            ui.play.innerText = 'Pause Timeline';
            
            sourceNode.onended = () => { 
                if (state.isPlaying && (audioContext.currentTime - startTime) >= state.audioDuration - 0.1) { 
                    state.isPlaying = false; ui.play.innerText = 'Play Timeline'; 
                    state.audioTime = 0; ui.audioSeek.value = 0;
                    if (state.isRecording) stopRecording(); 
                } 
            };
        }

        ui.play.addEventListener('click', async () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
            
            if (state.isPlaying) {
                if (sourceNode) sourceNode.stop();
                state.isPlaying = false; ui.play.innerText = 'Play Timeline';
            } else {
                playAudioAt(state.audioTime);
            }
        });

        // --- ENGINE MATH ---
        function cleanName(n) { return n.toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function setMorphUniversal(mesh, searchNames, value, speed = 0.4) {
            if (!mesh.morphTargetDictionary) return;
            const keys = Object.keys(mesh.morphTargetDictionary);
            for (const search of searchNames) {
                const cleanSearch = cleanName(search);
                for (const key of keys) {
                    if (cleanName(key) === cleanSearch || (cleanSearch.length > 2 && cleanName(key).includes(cleanSearch))) {
                        const idx = mesh.morphTargetDictionary[key];
                        mesh.morphTargetInfluences[idx] = THREE.MathUtils.lerp(mesh.morphTargetInfluences[idx], Math.min(value, 1.0), speed);
                        break; 
                    }
                }
            }
        }

        function setBoneAbsolute(bone, x, y, z) {
            if (!bone || !state.initialBones[bone.name]) return;
            const offsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
            bone.quaternion.copy(state.initialBones[bone.name].q).multiply(offsetQ);
        }

        function applyAdditiveProcedural(bone, x, y, z) {
            if (!bone) return;
            const offsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
            bone.quaternion.multiply(offsetQ); 
        }

        // Retrieves the target pose based on the timeline
        function getTargetPoseAtTime(t) {
            const block = state.blocks.find(b => t >= b.start && t <= b.end);
            return block ? block.customPose : BaseRest;
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            state.time += delta;

            if (currentModel) {
                const scl = parseFloat(ui.scale.value) || 1;
                const px = parseFloat(ui.posX.value) || 0;
                const py = parseFloat(ui.posY.value) || 0;
                const pz = parseFloat(ui.posZ.value) || 0;
                modelGroup.scale.setScalar(scl);
                modelGroup.position.set(px, py, pz);
            }

            let vocalEnergy = 0, highEnergy = 0;
            if (state.isPlaying && audioContext) {
                state.audioTime = audioContext.currentTime - startTime;
                ui.audioSeek.value = state.audioTime;
                ui.timeCur.innerText = state.audioTime.toFixed(1) + 's';
                
                analyser.getByteFrequencyData(dataArray);
                for (let i = 2; i < 20; i++) vocalEnergy += dataArray[i];
                vocalEnergy = (vocalEnergy / 18) / 255;
                for (let i = 20; i < 60; i++) highEnergy += dataArray[i];
                highEnergy = (highEnergy / 40) / 255;
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, vocalEnergy, 0.15);
            } else {
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, 0, 0.1);
            }

            // --- THE SMOOTHING ENGINE ---
            // Calculate what pose we *should* be in right now
            const targetPose = getTargetPoseAtTime(state.audioTime);
            
            // Smoothly lerp the engine's internal state towards the target
            // 8.0 multiplier means it takes ~0.2 seconds to smoothly fade between poses (no snapping)
            for (let key in state.smoothPose) {
                state.smoothPose[key] = THREE.MathUtils.lerp(state.smoothPose[key], targetPose[key], delta * 8.0);
            }

            if (currentModel) {
                // Apply the smoothed pose to the bones
                const p = state.smoothPose;
                setBoneAbsolute(state.bones.lShoulder, p.lSP, 0, p.lSR);
                setBoneAbsolute(state.bones.lArm, p.lAP, 0, p.lAR);
                setBoneAbsolute(state.bones.lFore, p.lFP, p.lFY, 0);
                setBoneAbsolute(state.bones.lHand, p.lHP, 0, p.lHR);

                setBoneAbsolute(state.bones.rShoulder, p.rSP, 0, p.rSR);
                setBoneAbsolute(state.bones.rArm, p.rAP, 0, -p.rAR); // Mirrored visually
                setBoneAbsolute(state.bones.rFore, p.rFP, p.rFY, 0);
                setBoneAbsolute(state.bones.rHand, p.rHP, 0, -p.rHR);

                // Layer Procedural Life Over It
                const t = state.time;
                const swayAmp = parseFloat(ui.animSway.value);
                const talk = state.speechEnergy;

                // Eyes & Blinking
                state.blinkTimer += delta;
                if (state.blinkTimer > state.nextBlinkTime) {
                    const bp = state.blinkTimer - state.nextBlinkTime;
                    if (bp < 0.05) state.isBlinkingNow = bp / 0.05; 
                    else if (bp < 0.15) state.isBlinkingNow = 1.0 - ((bp - 0.05) / 0.10); 
                    else { state.isBlinkingNow = 0; state.blinkTimer = 0; state.nextBlinkTime = Math.random() * 4.0 + 2.0; }
                }

                if (t > state.nextSaccadeTime) {
                    state.eyeTarget.x = (Math.random() - 0.5) * 0.4;
                    state.eyeTarget.y = (Math.random() - 0.5) * 0.2;
                    state.nextSaccadeTime = t + Math.random() * 2.5 + 0.5;
                }
                state.currentEyePos.lerp(state.eyeTarget, 0.1);

                setBoneAbsolute(state.bones.lEye, 0,0,0); applyAdditiveProcedural(state.bones.lEye, state.currentEyePos.y, state.currentEyePos.x, 0);
                setBoneAbsolute(state.bones.rEye, 0,0,0); applyAdditiveProcedural(state.bones.rEye, state.currentEyePos.y, state.currentEyePos.x, 0);

                // Core Body Sway
                if (state.bones.hips) {
                    const shiftX = Math.sin(t * 0.4) * 0.015 * swayAmp;
                    setBoneAbsolute(state.bones.hips, 0,0,0);
                    applyAdditiveProcedural(state.bones.hips, 0, 0, -shiftX * 2);
                }

                const breath = Math.sin(t * 1.8) * 0.015 * swayAmp;
                const swayX = Math.sin(t * 0.4) * 0.03 * swayAmp;
                setBoneAbsolute(state.bones.spine, 0,0,0); applyAdditiveProcedural(state.bones.spine, breath, 0, swayX);
                setBoneAbsolute(state.bones.chest, 0,0,0); applyAdditiveProcedural(state.bones.chest, breath * 1.5, 0, swayX * 0.5);

                const nod = (Math.sin(t * 3) * 0.03 * talk) + (breath * 0.5);
                setBoneAbsolute(state.bones.neck, 0,0,0); applyAdditiveProcedural(state.bones.neck, nod + state.currentEyePos.y * 0.2, state.currentEyePos.x * 0.3, -swayX);
                setBoneAbsolute(state.bones.head, 0,0,0); applyAdditiveProcedural(state.bones.head, nod + state.currentEyePos.y * 0.3, state.currentEyePos.x * 0.4, 0);

                // Syllable Emphasis (Chop hands slightly on audio beat if arms are raised > 0.5 rad)
                if (p.lFP > 0.5 || p.rFP > 0.5) { 
                    const chopL = Math.sin(t * 5.2) * talk * 0.15;
                    const chopR = Math.sin(t * 4.8) * talk * 0.15;
                    if(p.lFP > 0.5) applyAdditiveProcedural(state.bones.lFore, chopL, 0, 0);
                    if(p.rFP > 0.5) applyAdditiveProcedural(state.bones.rFore, chopR, 0, 0);
                }
            }

            // Lip Sync
            const mouthMax = parseFloat(ui.mouthAmp.value);
            state.morphMeshes.forEach(mesh => {
                if (state.isPlaying) {
                    const jaw = vocalEnergy * 2.5 * mouthMax; 
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah'], jaw, 0.4);
                    setMorphUniversal(mesh, ['mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], highEnergy * mouthMax, 0.3);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.2 + (highEnergy * 0.4), 0.2);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], talk * 0.8, 0.2);
                } else {
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah', 'mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], 0, 0.2);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.05, 0.1);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], 0, 0.1);
                }
                setMorphUniversal(mesh, ['eyeblinkleft', 'blinkleft', 'eyecloseleft'], state.isBlinkingNow, 0.8); 
                setMorphUniversal(mesh, ['eyeblinkright', 'blinkright', 'eyecloseright'], state.isBlinkingNow, 0.8); 
                setMorphUniversal(mesh, ['blink', 'fcleyeclose', 'eyesclosed'], state.isBlinkingNow, 0.8); 
            });

            controls.update(); renderer.render(scene, camera);
        }
        animate();

        // --- EXPORT ---
        let mediaRecorder, chunks = [];
        ui.rec.addEventListener('click', () => state.isRecording ? stopRecording() : startRecording());

        function startRecording() {
            chunks = [];
            const stream = new MediaStream([...renderer.domElement.captureStream(60).getVideoTracks(), ...(mediaStreamDest ? mediaStreamDest.stream.getAudioTracks() : [])]);
            const opts = ['video/webm;codecs=vp9,opus', 'video/mp4'].find(o => MediaRecorder.isTypeSupported(o)) || '';
            mediaRecorder = new MediaRecorder(stream, { mimeType: opts, videoBitsPerSecond: 10000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const url = URL.createObjectURL(new Blob(chunks, { type: mediaRecorder.mimeType }));
                const a = document.createElement('a'); a.href = url;
                a.download = `avatar_video.${opts.includes('mp4') ? 'mp4' : 'webm'}`;
                a.click(); URL.revokeObjectURL(url);
            };
            
            if (sourceNode) sourceNode.stop();
            state.audioTime = 0; ui.audioSeek.value = 0;
            mediaRecorder.start(); state.isRecording = true;
            ui.rec.innerText = 'Stop & Export'; ui.rec.style.backgroundColor = '#6c757d';
            playAudioAt(0);
        }
        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            state.isRecording = false; ui.rec.innerText = 'Record & Export Video'; ui.rec.style.backgroundColor = 'var(--danger-color)';
        }

        ui.theme.addEventListener('click', () => document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
</html>
