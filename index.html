<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal 3D Avatar Studio - Pro Animation</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --panel-bg: #ffffff; --text-color: #333333;
            --border-color: #cccccc; --accent-color: #007bff; --accent-hover: #0056b3;
            --danger-color: #dc3545; --debug-bg: #f8f9fa; --section-bg: #eef2f5;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --border-color: #333333; --accent-color: #3f51b5; --accent-hover: #2c387e;
            --debug-bg: #2a2a2a; --section-bg: #252525;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar {
            width: 440px; background-color: var(--panel-bg); border-right: 1px solid var(--border-color);
            padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; z-index: 10;
        }
        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .panel-section { background: var(--section-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        
        label { font-size: 0.85em; font-weight: bold; }
        .sub-label { font-size: 0.75em; color: gray; font-weight: normal; margin-top:-3px; }
        
        input[type="file"], input[type="color"], select {
            width: 100%; padding: 8px; background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
        }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        button {
            padding: 10px; border: none; border-radius: 4px; background-color: var(--accent-color);
            color: white; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.6; }
        #btnRecord { background-color: var(--danger-color); margin-top: 5px; }
        #btnCenter { background-color: #28a745; margin-top: 5px; }
        #btnCenter:hover { background-color: #218838; }
        
        #diagnostics { background-color: var(--debug-bg); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.75em; max-height: 120px; overflow-y: auto; }
        .success { color: #28a745; font-weight:bold; } .warning { color: #ffc107; font-weight:bold; } .error { color: #dc3545; font-weight:bold; }
        
        #main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; }
        #canvas-container { position: relative; background-color: #00ff00; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; z-index: 100; padding: 6px 12px; font-size: 0.8em; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div id="sidebar">
        <h2 style="font-size: 1.2em; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;">Universal Avatar Studio</h2>
        
        <div class="control-group">
            <label>1. Load 3D Model (.glb)</label>
            <input type="file" id="glbInput" accept=".glb">
        </div>

        <div id="diagnostics"><div id="model-info">Upload a model to initialize...</div></div>

        <!-- NEW: Dynamic Animation Controls -->
        <div class="panel-section">
            <label style="color: var(--accent-color);">Dynamic Animation Controls</label>
            <div class="control-group">
                <label class="sub-label">Hand & Arm Gestures (Demonstrating)</label>
                <input type="range" id="animGestures" min="0" max="3" step="0.1" value="1.2">
            </div>
            <div class="row-group">
                <div class="control-group" style="flex:1;">
                    <label class="sub-label">Body Sway</label>
                    <input type="range" id="animSway" min="0" max="3" step="0.1" value="1">
                </div>
                <div class="control-group" style="flex:1;">
                    <label class="sub-label">Head Nodding</label>
                    <input type="range" id="animHead" min="0" max="3" step="0.1" value="1">
                </div>
            </div>
        </div>

        <!-- Expression & Framing -->
        <div class="panel-section">
            <label style="color: var(--accent-color);">Expression & Posture Tuning</label>
            <label class="sub-label">Mouth Intensity</label>
            <input type="range" id="mouthAmp" min="0" max="2" step="0.05" value="0.8">
            <label class="sub-label" style="margin-top: 5px;">Resting Arm Pitch (Fix T-Pose)</label>
            <input type="range" id="armPitch" min="-1.5" max="1.5" step="0.05" value="0.2">
        </div>

        <div class="panel-section">
            <label style="color: var(--accent-color);">Framing & Positioning</label>
            <button id="btnCenter" disabled>🎯 Center & Fit Model</button>
            <div class="row-group" style="margin-top: 5px;">
                <div class="control-group" style="flex:1;"><label class="sub-label">Scale</label><input type="range" id="modScale" min="0.1" max="5" step="0.05" value="1"></div>
                <div class="control-group" style="flex:1;"><label class="sub-label">Up / Down</label><input type="range" id="modPosY" min="-5" max="5" step="0.1" value="0"></div>
            </div>
            <div class="row-group">
                <div class="control-group" style="flex:1;"><label class="sub-label">Left / Right</label><input type="range" id="modPosX" min="-5" max="5" step="0.1" value="0"></div>
                <div class="control-group" style="flex:1;"><label class="sub-label">Near / Far</label><input type="range" id="modPosZ" min="-5" max="5" step="0.1" value="0"></div>
            </div>
        </div>

        <div class="control-group">
            <label>2. Load Audio Speech</label>
            <input type="file" id="audioInput" accept="audio/*">
        </div>

        <div class="row-group">
            <div class="control-group" style="flex: 1;"><label>Background</label><input type="color" id="bgColor" value="#00ff00"></div>
            <div class="control-group" style="flex: 1;">
                <label>Format</label>
                <select id="resolution">
                    <option value="landscape">16:9 (HD)</option>
                    <option value="portrait">9:16 (Shorts)</option>
                </select>
            </div>
        </div>

        <button id="btnPlayPause" disabled>Play / Pause Audio</button>
        <button id="btnRecord" disabled>Record & Export Video</button>
    </div>

    <div id="main-content">
        <button class="theme-toggle" id="btnTheme">Toggle Theme</button>
        <div id="canvas-container"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const state = {
            isPlaying: false, isRecording: false, resolution: { w: 1920, h: 1080 },
            morphMeshes: [], bones: {}, initialBones: {},
            time: 0, speechEnergy: 0,
            eyeTarget: new THREE.Vector2(0, 0), currentEyePos: new THREE.Vector2(0, 0), nextSaccadeTime: 0,
        };

        const ui = {
            glb: document.getElementById('glbInput'), audio: document.getElementById('audioInput'),
            bg: document.getElementById('bgColor'), res: document.getElementById('resolution'),
            play: document.getElementById('btnPlayPause'), rec: document.getElementById('btnRecord'),
            centerBtn: document.getElementById('btnCenter'), theme: document.getElementById('btnTheme'),
            container: document.getElementById('canvas-container'), info: document.getElementById('model-info'),
            pitch: document.getElementById('armPitch'), mouthAmp: document.getElementById('mouthAmp'),
            scale: document.getElementById('modScale'), posX: document.getElementById('modPosX'), 
            posY: document.getElementById('modPosY'), posZ: document.getElementById('modPosZ'),
            animGestures: document.getElementById('animGestures'), animSway: document.getElementById('animSway'),
            animHead: document.getElementById('animHead')
        };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(ui.bg.value);
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        const camera = new THREE.PerspectiveCamera(45, state.resolution.w / state.resolution.h, 0.01, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(state.resolution.w, state.resolution.h);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        ui.container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const keyLight = new THREE.DirectionalLight(0xfffaf0, 2.2);
        keyLight.position.set(5, 5, 5); keyLight.castShadow = true;
        scene.add(keyLight);
        scene.add(new THREE.DirectionalLight(0xd0e0ff, 1.0)).position.set(-5, 3, 3);

        let currentModel = null, audioContext, analyser, audioBuffer, mediaStreamDest, dataArray, sourceNode, startTime = 0, pauseTime = 0;

        function resize() {
            const parent = ui.container.parentElement;
            const aspect = state.resolution.w / state.resolution.h;
            if (parent.clientWidth / parent.clientHeight > aspect) {
                ui.container.style.height = '88vh'; ui.container.style.width = `calc(88vh * ${aspect})`;
            } else {
                ui.container.style.width = '88vw'; ui.container.style.height = `calc(88vw / ${aspect})`;
            }
            camera.aspect = aspect; camera.updateProjectionMatrix();
            renderer.setSize(state.resolution.w, state.resolution.h);
        }
        window.addEventListener('resize', resize); resize();
        ui.res.addEventListener('change', e => { state.resolution = e.target.value === 'landscape' ? {w:1920, h:1080} : {w:1080, h:1920}; resize(); });
        ui.bg.addEventListener('input', e => scene.background.set(e.target.value));

        function centerAndFitModel() {
            if (!currentModel) return;
            ui.scale.value = 1; ui.posX.value = 0; ui.posY.value = 0; ui.posZ.value = 0;
            modelGroup.scale.set(1, 1, 1); modelGroup.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim === 0) return;

            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.4;
            camera.position.set(center.x, center.y + (size.y * 0.1), center.z + cameraZ);
            controls.target.set(center.x, center.y + (size.y * 0.2), center.z);
            camera.far = cameraZ * 10; camera.updateProjectionMatrix(); controls.update();
        }
        ui.centerBtn.addEventListener('click', centerAndFitModel);

        ui.glb.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            ui.info.innerHTML = "Loading & Parsing 3D Model...";
            
            const url = window.URL.createObjectURL(file);
            new GLTFLoader().load(url, gltf => {
                if (currentModel) modelGroup.remove(currentModel);
                currentModel = gltf.scene;
                modelGroup.add(currentModel);
                
                state.morphMeshes = []; state.bones = {}; state.initialBones = {};
                let blendshapeCount = 0;
                
                currentModel.traverse(node => {
                    if (node.isMesh) {
                        node.castShadow = true;
                        if (node.morphTargetDictionary) {
                            state.morphMeshes.push(node);
                            blendshapeCount += Object.keys(node.morphTargetDictionary).length;
                        }
                    }
                    if (node.isBone) {
                        const n = node.name.toLowerCase();
                        if (n.includes('hips') || n.includes('pelvis')) state.bones.hips = node;
                        else if (n.includes('spine2') || n.includes('chest')) state.bones.chest = node;
                        else if (n.includes('spine') && !n.includes('1') && !n.includes('2')) state.bones.spine = node;
                        else if (n.includes('neck')) state.bones.neck = node;
                        else if (n.includes('head') && !n.includes('top')) state.bones.head = node;
                        else if (n.includes('leftarm') || n.includes('arm_l') || n.includes('upperarm_l')) state.bones.lArm = node;
                        else if (n.includes('rightarm') || n.includes('arm_r') || n.includes('upperarm_r')) state.bones.rArm = node;
                        else if (n.includes('leftforearm') || n.includes('forearm_l')) state.bones.lFore = node;
                        else if (n.includes('rightforearm') || n.includes('forearm_r')) state.bones.rFore = node;
                        // Map Hands/Wrists for Demonstrating
                        else if (n.includes('lefthand') || n.includes('hand_l')) state.bones.lHand = node;
                        else if (n.includes('righthand') || n.includes('hand_r')) state.bones.rHand = node;
                        else if (n.includes('lefteye') || n.includes('eye_l')) state.bones.lEye = node;
                        else if (n.includes('righteye') || n.includes('eye_r')) state.bones.rEye = node;

                        state.initialBones[node.name] = { q: node.quaternion.clone(), p: node.position.clone() };
                    }
                });

                ui.info.innerHTML = `<span class="success">Model Ready! Found ${blendshapeCount} Blendshapes.</span>`;
                ui.centerBtn.disabled = false; centerAndFitModel();
                if(audioBuffer) ui.rec.disabled = false;
                window.URL.revokeObjectURL(url);
            });
        });

        ui.audio.addEventListener('change', async e => {
            const arrayBuffer = await e.target.files[0].arrayBuffer();
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.decodeAudioData(arrayBuffer, buffer => {
                audioBuffer = buffer; analyser = audioContext.createAnalyser();
                analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.7;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                mediaStreamDest = audioContext.createMediaStreamDestination();
                ui.play.disabled = false; if(currentModel) ui.rec.disabled = false;
            });
        });

        ui.play.addEventListener('click', async () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
            if (state.isPlaying) {
                if (sourceNode) { sourceNode.stop(); pauseTime = audioContext.currentTime - startTime; }
                state.isPlaying = false; ui.play.innerText = 'Play Audio';
            } else {
                sourceNode = audioContext.createBufferSource(); sourceNode.buffer = audioBuffer;
                sourceNode.connect(analyser); analyser.connect(audioContext.destination); analyser.connect(mediaStreamDest);
                sourceNode.start(0, pauseTime); startTime = audioContext.currentTime - pauseTime;
                state.isPlaying = true; ui.play.innerText = 'Pause Audio';
                sourceNode.onended = () => { if (state.isPlaying) { state.isPlaying = false; pauseTime = 0; ui.play.innerText = 'Play Audio'; if (state.isRecording) stopRecording(); } };
            }
        });

        function cleanName(n) { return n.toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function setMorphUniversal(mesh, searchNames, value, speed = 0.4) {
            if (!mesh.morphTargetDictionary) return;
            const keys = Object.keys(mesh.morphTargetDictionary);
            for (const search of searchNames) {
                const cleanSearch = cleanName(search);
                for (const key of keys) {
                    const cleanKey = cleanName(key);
                    if (cleanKey === cleanSearch || cleanKey.includes(cleanSearch)) {
                        const idx = mesh.morphTargetDictionary[key];
                        mesh.morphTargetInfluences[idx] = THREE.MathUtils.lerp(mesh.morphTargetInfluences[idx], Math.min(value, 1.0), speed);
                        return;
                    }
                }
            }
        }

        function applyAdditiveRotation(bone, x, y, z) {
            if (!bone || !state.initialBones[bone.name]) return;
            const offsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
            bone.quaternion.copy(state.initialBones[bone.name].q).multiply(offsetQ);
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            state.time += delta;
            const t = state.time;

            if (currentModel) {
                modelGroup.scale.setScalar(parseFloat(ui.scale.value));
                modelGroup.position.set(parseFloat(ui.posX.value), parseFloat(ui.posY.value), parseFloat(ui.posZ.value));
            }

            let vocalEnergy = 0, highEnergy = 0;
            if (state.isPlaying && analyser) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 2; i < 20; i++) vocalEnergy += dataArray[i];
                vocalEnergy = (vocalEnergy / 18) / 255;
                for (let i = 20; i < 60; i++) highEnergy += dataArray[i];
                highEnergy = (highEnergy / 40) / 255;
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, vocalEnergy, 0.15);
            } else {
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, 0, 0.1);
            }

            const talk = state.speechEnergy;
            const mouthMax = parseFloat(ui.mouthAmp.value);
            
            // UI Multipliers
            const gestAmp = parseFloat(ui.animGestures.value);
            const swayAmp = parseFloat(ui.animSway.value);
            const headAmp = parseFloat(ui.animHead.value);

            if (t > state.nextSaccadeTime) {
                state.eyeTarget.x = (Math.random() - 0.5) * 0.4;
                state.eyeTarget.y = (Math.random() - 0.5) * 0.2;
                state.nextSaccadeTime = t + Math.random() * 2.5 + 0.5;
                state.morphMeshes.forEach(m => setMorphUniversal(m, ['eyeblinkleft', 'eyeblinkright', 'blink', 'fcleyeclose'], 1.0, 0.8));
            }
            state.currentEyePos.lerp(state.eyeTarget, 0.1);

            if (currentModel) {
                applyAdditiveRotation(state.bones.lEye, state.currentEyePos.y, state.currentEyePos.x, 0);
                applyAdditiveRotation(state.bones.rEye, state.currentEyePos.y, state.currentEyePos.x, 0);

                if (state.bones.hips) {
                    const shiftX = Math.sin(t * 0.4) * 0.015 * swayAmp;
                    applyAdditiveRotation(state.bones.hips, 0, 0, -shiftX * 2);
                }

                const breath = Math.sin(t * 1.8) * 0.015 * swayAmp;
                const swayX = Math.sin(t * 0.4) * 0.03 * swayAmp;
                applyAdditiveRotation(state.bones.spine, breath, 0, swayX);
                applyAdditiveRotation(state.bones.chest, breath * 1.5, 0, swayX * 0.5);

                const nod = ((Math.sin(t * 3) * 0.03 * talk) + (breath * 0.5)) * headAmp;
                applyAdditiveRotation(state.bones.neck, nod + state.currentEyePos.y * 0.2, state.currentEyePos.x * 0.3, -swayX);
                applyAdditiveRotation(state.bones.head, nod + state.currentEyePos.y * 0.3, state.currentEyePos.x * 0.4, 0);

                // DEMONSTRATING ARMS MATH
                const p = parseFloat(ui.pitch.value);
                // When talking, lift arms up and bend elbows outward to explain/demonstrate
                const demoLift = talk * 0.6 * gestAmp; 

                // Left Arm & Hand
                const lArmPitch = p + (Math.sin(t * 2.2) * 0.08 * talk * gestAmp) + (demoLift * 0.7);
                const lArmRoll = (Math.sin(t * 1.5) * 0.08 * talk * gestAmp) + (demoLift * 0.4);
                const lForePitch = (p * 0.5) + (demoLift * 1.4) + (Math.sin(t * 3.1) * 0.1 * talk * gestAmp);
                applyAdditiveRotation(state.bones.lArm, lArmPitch, 0, lArmRoll);
                applyAdditiveRotation(state.bones.lFore, lForePitch, 0, 0);
                applyAdditiveRotation(state.bones.lHand, demoLift * 0.3, 0, Math.sin(t * 4) * 0.1 * talk * gestAmp); // Expressive wrist

                // Right Arm & Hand
                const rArmPitch = p + (Math.cos(t * 1.9) * 0.08 * talk * gestAmp) + (demoLift * 0.7);
                const rArmRoll = -(Math.cos(t * 1.3) * 0.08 * talk * gestAmp) - (demoLift * 0.4);
                const rForePitch = (p * 0.5) + (demoLift * 1.4) + (Math.cos(t * 2.8) * 0.1 * talk * gestAmp);
                applyAdditiveRotation(state.bones.rArm, rArmPitch, 0, rArmRoll);
                applyAdditiveRotation(state.bones.rFore, rForePitch, 0, 0);
                applyAdditiveRotation(state.bones.rHand, demoLift * 0.3, 0, Math.cos(t * 4) * 0.1 * talk * gestAmp); // Expressive wrist
            }

            state.morphMeshes.forEach(mesh => {
                if (state.isPlaying) {
                    const jaw = vocalEnergy * 2.5 * mouthMax; 
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah'], jaw, 0.4);
                    setMorphUniversal(mesh, ['mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], highEnergy * mouthMax, 0.3);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.2 + (highEnergy * 0.4), 0.2);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], talk * 0.8, 0.2);
                } else {
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah', 'mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], 0, 0.2);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.05, 0.1);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], 0, 0.1);
                }
                setMorphUniversal(mesh, ['eyeblinkleft', 'eyeblinkright', 'blink', 'fcleyeclose'], 0, 0.15); 
            });

            controls.update(); renderer.render(scene, camera);
        }
        animate();

        let mediaRecorder, chunks = [];
        ui.rec.addEventListener('click', () => state.isRecording ? stopRecording() : startRecording());

        function startRecording() {
            chunks = [];
            const stream = new MediaStream([...renderer.domElement.captureStream(60).getVideoTracks(), ...(mediaStreamDest ? mediaStreamDest.stream.getAudioTracks() : [])]);
            const opts = ['video/webm;codecs=vp9,opus', 'video/mp4'].find(o => MediaRecorder.isTypeSupported(o)) || '';
            mediaRecorder = new MediaRecorder(stream, { mimeType: opts, videoBitsPerSecond: 10000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const url = URL.createObjectURL(new Blob(chunks, { type: mediaRecorder.mimeType }));
                const a = document.createElement('a'); a.href = url;
                a.download = `avatar_video.${opts.includes('mp4') ? 'mp4' : 'webm'}`;
                a.click(); URL.revokeObjectURL(url);
            };
            mediaRecorder.start(); state.isRecording = true;
            ui.rec.innerText = 'Stop & Export'; ui.rec.style.backgroundColor = '#6c757d';
            if (!state.isPlaying && audioBuffer) ui.play.click();
        }
        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            state.isRecording = false; ui.rec.innerText = 'Record & Export Video'; ui.rec.style.backgroundColor = 'var(--danger-color)';
        }

        ui.theme.addEventListener('click', () => document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
</html>
