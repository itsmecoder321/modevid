<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Avatar Keyframer v10</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --panel-bg: #ffffff; --text-color: #333333;
            --border-color: #cccccc; --accent-color: #007bff; --accent-hover: #0056b3;
            --danger-color: #dc3545; --success-color: #28a745; --section-bg: #eef2f5; --block-bg: #e0f0ff;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --border-color: #333333; --accent-color: #3f51b5; --accent-hover: #2c387e;
            --section-bg: #252525; --block-bg: #1e3a5f;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        #sidebar {
            width: 500px; min-width: 500px; background-color: var(--panel-bg); 
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10;
        }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 12px 5px; background: none; border: none; color: var(--text-color); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; font-size: 0.9em; }
        .tab-btn.active { border-bottom: 3px solid var(--accent-color); color: var(--accent-color); background: var(--section-bg); }
        .tab-btn:hover { background: var(--section-bg); }

        .tab-content { padding: 15px; overflow-y: auto; flex-grow: 1; display: none; flex-direction: column; gap: 12px; }
        .tab-content.active { display: flex; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .panel-section { background: var(--section-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 8px; }
        
        label { font-size: 0.85em; font-weight: bold; }
        .sub-label { font-size: 0.7em; color: gray; font-weight: normal; margin-top:-3px; }
        
        input[type="file"], input[type="color"], input[type="number"], select {
            width: 100%; padding: 6px; background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px; font-size: 0.85em;
        }
        input[type="range"] { width: 100%; cursor: pointer; accent-color: var(--accent-color); }
        
        button { padding: 8px; border: none; border-radius: 4px; background-color: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 0.9em; }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.6; }
        
        #btnRecord { background-color: var(--danger-color); margin-top: 5px; }
        #btnCenter { background-color: var(--success-color); margin-bottom: 5px; }
        
        /* Audio Player Bar */
        .audio-player-box { background: var(--section-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); border-left: 4px solid var(--accent-color); margin-bottom: 10px; }
        .audio-times { display: flex; justify-content: space-between; font-size: 0.75em; color: gray; font-family: monospace; margin-top: 4px; }

        /* Timeline Blocks UI */
        #timelineList { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; max-height: 250px; overflow-y: auto; padding-right: 5px; }
        .tl-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85em; transition: 0.2s; }
        .tl-item.editing { border-left: 4px solid var(--danger-color); background: var(--block-bg); }
        
        .tl-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .tl-time-edit { display: flex; gap: 10px; align-items: center; }
        .time-input { width: 60px !important; padding: 4px !important; text-align: center; }
        
        .tl-actions { display: flex; gap: 5px; }
        .tl-btn { padding: 4px 8px; font-size: 0.8em; border-radius: 3px; border: none; font-weight: bold; cursor: pointer; }
        .tl-edit { background: var(--accent-color); color: white; }
        .tl-copy { background: #6c757d; color: white; }
        .tl-delete { background: var(--danger-color); color: white; }

        /* Pose Editor Modal Style */
        #poseEditorPanel { display: none; background: var(--bg-color); border: 2px dashed var(--danger-color); padding: 15px; border-radius: 6px; margin-top: 5px; }
        #poseEditorPanel.active { display: flex; flex-direction: column; gap: 8px; }
        .tuner-col { flex: 1; display: flex; flex-direction: column; gap: 6px; background: var(--section-bg); padding: 8px; border-radius: 4px; border: 1px solid var(--border-color); }

        #diagnostics { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.75em; max-height: 80px; overflow-y: auto; }
        .success { color: var(--success-color); font-weight:bold; } .warning { color: #ffc107; font-weight:bold; } .error { color: var(--danger-color); font-weight:bold; }
        
        #main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; background-color: var(--bg-color); }
        #canvas-container { position: relative; background-color: #00ff00; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; z-index: 100; padding: 6px 12px; font-size: 0.8em; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div id="sidebar">
        <!-- Persistent Player -->
        <div style="padding: 15px 15px 0 15px;">
            <div class="audio-player-box">
                <div class="control-group">
                    <label>Timeline Progress</label>
                    <input type="range" id="audioSeek" min="0" max="10" step="0.01" value="0">
                    <div class="audio-times">
                        <span id="timeCurrent">0.0s</span>
                        <span id="timeTotal">10.0s</span>
                    </div>
                </div>
                <button id="btnPlayPause" style="width: 100%; margin-top: 8px;">Play / Pause Timeline</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-target="tab-setup">1. Setup Environment</button>
            <button class="tab-btn" data-target="tab-timeline">2. Presets & Timeline Editor</button>
        </div>

        <!-- TAB 1: SETUP -->
        <div id="tab-setup" class="tab-content active">
            <div class="control-group">
                <label>Load 3D Model (.glb)</label>
                <input type="file" id="glbInput" accept=".glb">
            </div>
            <div id="diagnostics"><div id="model-info">Upload a model to initialize...</div></div>
            <div class="control-group">
                <label>Load Audio Speech (Optional)</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>

            <!-- Positioning -->
            <div class="panel-section">
                <label style="color: var(--accent-color);">Framing & Positioning</label>
                <button id="btnCenter" disabled>🎯 Auto Center & Fit</button>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Scale</label><input type="range" id="modScale" min="0.1" max="5" step="0.05" value="1"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Up / Down</label><input type="range" id="modPosY" min="-5" max="5" step="0.1" value="0"></div>
                </div>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left / Right</label><input type="range" id="modPosX" min="-5" max="5" step="0.1" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Near / Far</label><input type="range" id="modPosZ" min="-5" max="5" step="0.1" value="0"></div>
                </div>
            </div>

            <!-- Overrides -->
            <div class="panel-section" style="margin-top: auto;">
                <label style="color: var(--accent-color);">Export Settings</label>
                <div class="row-group">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Lip Sync Intensity</label><input type="range" id="mouthAmp" min="0" max="2" step="0.05" value="0.8"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Body Sway Intensity</label><input type="range" id="animSway" min="0" max="2" step="0.1" value="1.0"></div>
                </div>
                <div class="row-group" style="margin-top: 5px;">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Background Color</label><input type="color" id="bgColor" value="#00ff00"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Video Format</label>
                        <select id="resolution">
                            <option value="landscape">16:9 (HD)</option><option value="portrait">9:16 (Shorts)</option>
                        </select>
                    </div>
                </div>
                <button id="btnRecord" disabled style="margin-top: 8px;">Record & Export Video</button>
            </div>
        </div>

        <!-- TAB 2: TIMELINE & POSE EDITOR -->
        <div id="tab-timeline" class="tab-content">
            
            <div class="panel-section" style="background-color: #e8f4fd; border-color: #b8daff;">
                <label style="color: var(--accent-color);">➕ Add Preset Block</label>
                <div class="row-group">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Start (s)</label><input type="number" id="tlStart" min="0" step="0.1" value="0.0"></div>
                    <div class="control-group" style="flex: 1;"><label class="sub-label">End (s)</label><input type="number" id="tlEnd" min="0.1" step="0.1" value="3.0"></div>
                </div>
                <div class="row-group" style="margin-top: 5px;">
                    <div class="control-group" style="flex: 2;">
                        <select id="tlPreset">
                            <option value="explain_both">Explain (Both Hands)</option>
                            <option value="explain_right">Explain (Right Hand)</option>
                            <option value="explain_left">Explain (Left Hand)</option>
                            <option value="thinking">Thinking (Hand on Chin)</option>
                            <option value="hands_hips">Hands on Hips</option>
                            <option value="cross_arms">Crossed Arms</option>
                        </select>
                    </div>
                    <button id="btnAddBlock" style="flex: 1;">Add Block</button>
                </div>
            </div>

            <!-- DYNAMIC POSE TUNER (Moved above timeline for visibility) -->
            <div id="poseEditorPanel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label style="color: var(--danger-color);">Live Tuning Block</label>
                    <button id="btnDoneEdit" style="background:var(--text-color); padding:4px 8px;">Save & Close</button>
                </div>
                
                <div class="row-group" style="align-items: flex-start; margin-top: 10px;">
                    <!-- LEFT SIDE -->
                    <div class="tuner-col">
                        <label style="color: var(--accent-color); font-size: 0.8em; text-align:center;">LEFT ARM</label>
                        <div class="control-group"><label class="sub-label">Shoulder Pitch / Roll / <b style="color:#007bff">Twist</b></label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="lSP" min="-1" max="1" step="0.05" title="Pitch">
                                <input type="range" class="pose-slider" data-key="lSR" min="-1" max="1" step="0.05" title="Roll">
                                <input type="range" class="pose-slider" data-key="lSY" min="-1" max="1" step="0.05" title="Twist">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Arm Fwd/Back / Out/In / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="lAP" min="-2.5" max="2.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="lAR" min="-2.5" max="2.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="lAY" min="-2.5" max="2.5" step="0.05">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Elbow Bend / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="lFP" min="-2.8" max="2.8" step="0.05">
                                <input type="range" class="pose-slider" data-key="lFY" min="-2.8" max="2.8" step="0.05">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Wrist Bend / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="lHP" min="-1.5" max="1.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="lHR" min="-1.5" max="1.5" step="0.05">
                            </div>
                        </div>
                    </div>
                    
                    <!-- RIGHT SIDE -->
                    <div class="tuner-col">
                        <label style="color: var(--accent-color); font-size: 0.8em; text-align:center;">RIGHT ARM</label>
                        <div class="control-group"><label class="sub-label">Shoulder Pitch / Roll / <b style="color:#007bff">Twist</b></label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="rSP" min="-1" max="1" step="0.05" title="Pitch">
                                <input type="range" class="pose-slider" data-key="rSR" min="-1" max="1" step="0.05" title="Roll">
                                <input type="range" class="pose-slider" data-key="rSY" min="-1" max="1" step="0.05" title="Twist">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Arm Fwd/Back / Out/In / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="rAP" min="-2.5" max="2.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="rAR" min="-2.5" max="2.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="rAY" min="-2.5" max="2.5" step="0.05">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Elbow Bend / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="rFP" min="-2.8" max="2.8" step="0.05">
                                <input type="range" class="pose-slider" data-key="rFY" min="-2.8" max="2.8" step="0.05">
                            </div>
                        </div>
                        <div class="control-group"><label class="sub-label">Wrist Bend / Twist</label>
                            <div class="row-group">
                                <input type="range" class="pose-slider" data-key="rHP" min="-1.5" max="1.5" step="0.05">
                                <input type="range" class="pose-slider" data-key="rHR" min="-1.5" max="1.5" step="0.05">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Editable Timeline List -->
            <div class="panel-section" style="flex-grow: 1;">
                <label style="color: var(--accent-color);">Editable Timeline Tracks</label>
                <div id="timelineList"></div>
            </div>

        </div>
    </div>

    <div id="main-content">
        <button class="theme-toggle" id="btnTheme">Toggle Theme</button>
        <div id="canvas-container"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- PRESET POSE LIBRARY (20 Axes) ---
        const BaseRest = { 
            lSP:0, lSR:0, lSY:0, lAP:0.1, lAR:0.15, lAY:0, lFP:0.1, lFY:0, lHP:0, lHR:0, 
            rSP:0, rSR:0, rSY:0, rAP:0.1, rAR:0.15, rAY:0, rFP:0.1, rFY:0, rHP:0, rHR:0 
        };
        
        const PoseLibrary = {
            explain_both: { ...BaseRest, lSP:0.15, lAP:0.6, lAR:0.3, lFP:1.5, lFY:0.3, lHP:-0.2, rSP:0.15, rAP:0.6, rAR:0.3, rFP:1.5, rFY:-0.3, rHP:-0.2 },
            explain_right: { ...BaseRest, rSP:0.15, rAP:0.6, rAR:0.3, rFP:1.5, rFY:-0.3, rHP:-0.2 },
            explain_left: { ...BaseRest, lSP:0.15, lAP:0.6, lAR:0.3, lFP:1.5, lFY:0.3, lHP:-0.2 },
            thinking: { ...BaseRest, rSP:0.1, rAP:0.8, rAY:-0.2, rAR:-0.1, rFP:2.1, rFY:-0.5, rHP:-0.1 },
            hands_hips: { ...BaseRest, lAP:0.2, lAR:0.5, lAY:0.4, lFP:1.0, lFY:0.8, lHP:-0.4, rAP:0.2, rAR:0.5, rAY:-0.4, rFP:1.0, rFY:-0.8, rHP:-0.4 },
            cross_arms: { ...BaseRest, lAP:0.5, lAR:0.2, lAY:0.5, lFP:1.4, lFY:0.8, rAP:0.5, rAR:0.2, rAY:-0.5, rFP:1.4, rFY:-0.8 }
        };

        const state = {
            isPlaying: false, isRecording: false, resolution: { w: 1920, h: 1080 },
            morphMeshes: [], bones: {}, initialBones: {},
            time: 0, audioTime: 0, audioDuration: 10.0, speechEnergy: 0,
            timelineClock: 0, playBaseTime: 0, playEpoch: 0, audioSyncLast: 0,
            playStartWallTime: 0, playStartTimeline: 0,
            eyeTarget: new THREE.Vector2(0, 0), currentEyePos: new THREE.Vector2(0, 0), nextSaccadeTime: 0,
            blinkTimer: 0, nextBlinkTime: 2.0, isBlinkingNow: 0,
            
            blocks: [], // Array of Custom Timeline Poses
            editingBlockId: null,
            smoothPose: { ...BaseRest } 
        };

        const ui = {
            glb: document.getElementById('glbInput'), audio: document.getElementById('audioInput'),
            bg: document.getElementById('bgColor'), res: document.getElementById('resolution'),
            play: document.getElementById('btnPlayPause'), rec: document.getElementById('btnRecord'),
            centerBtn: document.getElementById('btnCenter'), theme: document.getElementById('btnTheme'),
            container: document.getElementById('canvas-container'), info: document.getElementById('model-info'),
            mouthAmp: document.getElementById('mouthAmp'), animSway: document.getElementById('animSway'),
            scale: document.getElementById('modScale'), posX: document.getElementById('modPosX'), posY: document.getElementById('modPosY'), posZ: document.getElementById('modPosZ'),
            audioSeek: document.getElementById('audioSeek'), timeCur: document.getElementById('timeCurrent'), timeTot: document.getElementById('timeTotal'),
            
            tlStart: document.getElementById('tlStart'), tlEnd: document.getElementById('tlEnd'), tlPreset: document.getElementById('tlPreset'),
            btnAddBlock: document.getElementById('btnAddBlock'), tlList: document.getElementById('timelineList'),
            tabs: document.querySelectorAll('.tab-btn'), tabContents: document.querySelectorAll('.tab-content'),
            editorPanel: document.getElementById('poseEditorPanel'), btnDoneEdit: document.getElementById('btnDoneEdit'),
            poseSliders: document.querySelectorAll('.pose-slider')
        };

        ui.tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                ui.tabs.forEach(t => t.classList.remove('active'));
                ui.tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // --- NEW TIMELINE RENDERING (With Inline Editing) ---
        window.updateBlockTime = function(id, type, value) {
            const block = state.blocks.find(b => b.id === id);
            if (block) {
                block[type] = parseFloat(value);
                renderTimeline();
            }
        };

        function renderTimeline() {
            state.blocks.sort((a, b) => a.start - b.start);
            ui.tlList.innerHTML = '';
            
            if (state.blocks.length === 0) {
                ui.tlList.innerHTML = '<div style="font-size:0.8em; color:gray; padding:5px;">Timeline is empty. Avatar will stay in Resting Pose.</div>';
            }

            state.blocks.forEach(block => {
                const div = document.createElement('div');
                const isEditing = state.editingBlockId === block.id;
                div.className = `tl-item ${isEditing ? 'editing' : ''}`;
                
                // HTML for the block including Inline Inputs
                div.innerHTML = `
                    <div class="tl-header">
                        <b>${block.label}</b>
                        <div class="tl-actions">
                            <button class="tl-btn tl-edit" id="edit-${block.id}">${isEditing ? 'Tuning...' : 'Tune'}</button>
                            <button class="tl-btn tl-copy" id="copy-${block.id}">Copy</button>
                            <button class="tl-btn tl-delete" id="del-${block.id}">X</button>
                        </div>
                    </div>
                    <div class="tl-time-edit">
                        <label class="sub-label" style="margin:0;">Start:</label>
                        <input type="number" class="time-input" value="${block.start.toFixed(1)}" step="0.1" onchange="window.updateBlockTime(${block.id}, 'start', this.value)">
                        <label class="sub-label" style="margin:0;">End:</label>
                        <input type="number" class="time-input" value="${block.end.toFixed(1)}" step="0.1" onchange="window.updateBlockTime(${block.id}, 'end', this.value)">
                    </div>
                `;
                
                ui.tlList.appendChild(div);

                // Attach Event Listeners
                document.getElementById(`edit-${block.id}`).onclick = () => isEditing ? closePoseEditor() : openPoseEditor(block.id);
                document.getElementById(`copy-${block.id}`).onclick = () => {
                    const duration = block.end - block.start;
                    const newBlock = { id: Date.now(), start: block.end, end: block.end + duration, label: block.label, customPose: JSON.parse(JSON.stringify(block.customPose)) };
                    state.blocks.push(newBlock);
                    ui.tlStart.value = newBlock.end.toFixed(1); ui.tlEnd.value = (newBlock.end + duration).toFixed(1);
                    renderTimeline();
                };
                document.getElementById(`del-${block.id}`).onclick = () => {
                    state.blocks = state.blocks.filter(b => b.id !== block.id);
                    if (state.editingBlockId === block.id) closePoseEditor();
                    renderTimeline();
                };
            });
        }

        ui.btnAddBlock.addEventListener('click', () => {
            const start = parseFloat(ui.tlStart.value);
            const end = parseFloat(ui.tlEnd.value);
            if (start >= end) { alert("End time must be greater than Start."); return; }
            
            const presetId = ui.tlPreset.value;
            const label = ui.tlPreset.options[ui.tlPreset.selectedIndex].text;
            const customPose = { ...PoseLibrary[presetId] }; 
            
            state.blocks.push({ id: Date.now(), start, end, label, customPose });
            ui.tlStart.value = end.toFixed(1);
            ui.tlEnd.value = (end + (end - start)).toFixed(1);
            renderTimeline();
        });

        function openPoseEditor(blockId) {
            state.editingBlockId = blockId;
            const block = state.blocks.find(b => b.id === blockId);
            if (!block) return;
            
            ui.editorPanel.classList.add('active');
            
            ui.poseSliders.forEach(slider => {
                const key = slider.getAttribute('data-key');
                slider.value = block.customPose[key] || 0;
            });
            
            // Scrub audio to the middle of the block so user sees what they are tuning
            seekAudio(block.start + ((block.end - block.start) / 2));
            renderTimeline();
        }

        function closePoseEditor() {
            state.editingBlockId = null;
            ui.editorPanel.classList.remove('active');
            renderTimeline();
        }
        ui.btnDoneEdit.addEventListener('click', closePoseEditor);

        ui.poseSliders.forEach(slider => {
            slider.addEventListener('input', (e) => {
                if (!state.editingBlockId) return;

                if (block) {
                    const key = e.target.getAttribute('data-key');

        // ============================================================
        // SYNCHRONIZED AUDIO + TIMELINE ENGINE
        // HTMLAudioElement is the single source of truth for time.
        // ============================================================
        let audioElement = new Audio();
        audioElement.preload = 'auto';
        audioElement.playsInline = true;
        let audioObjectUrl = null;
        let audioMediaSource = null;
        let audioGraphReady = false;

        function getTimelineDuration() {
            const audioDurationValue =
                Number.isFinite(audioElement.duration) && audioElement.duration > 0
                    ? audioElement.duration
                    : 0;

            const blockDuration = state.blocks.length
                ? Math.max(...state.blocks.map(b => Number(b.end) || 0))
                : 0;

            return Math.max(audioDurationValue, blockDuration, 0);
        }

        function updateAudioUI(time) {
            const duration = getTimelineDuration();
            ui.audioSeek.max = Math.max(duration, 0.01);
            ui.audioSeek.value = Math.min(Math.max(time, 0), duration || 0);
            ui.timeCur.innerText = `${Math.max(0, time).toFixed(1)}s`;
            ui.timeTot.innerText = `${Math.max(0, duration).toFixed(1)}s`;
        }

        async function setupAudioGraph() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            if (!audioGraphReady) {
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.65;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                mediaStreamDest = audioContext.createMediaStreamDestination();
                audioMediaSource = audioContext.createMediaElementSource(audioElement);
                audioMediaSource.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.connect(mediaStreamDest);

            }
        }

        function applyTimelinePoseInstant(time) {
            const targetPose = getTargetPoseAtTime(time);
            for (const key of Object.keys(state.smoothPose)) {
                const value = targetPose[key] !== undefined && Number.isFinite(Number(targetPose[key]))
                    ? Number(targetPose[key])
                    : 0;
                state.smoothPose[key] = value;
            }
        }

        function seekAudio(time) {
            const duration =
                Number.isFinite(audioElement.duration) && audioElement.duration > 0
                    ? audioElement.duration
                    : getTimelineDuration();

            const target = THREE.MathUtils.clamp(Number(time) || 0, 0, Math.max(duration, 0));
            state.audioTime = target;

            if (audioElement.src) {
                try { audioElement.currentTime = target; }
                catch (err) { console.warn('Audio seek failed:', err); }
            }

            updateAudioUI(target);
            if (!state.isPlaying) {
                state.timelineClock = target;
                state.smoothPose = getTargetPoseAtTime(target);
            }
        }

        ui.audioSeek.addEventListener('input', (e) => { seekAudio(parseFloat(e.target.value)); });

        // --- THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(ui.bg.value);
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        const camera = new THREE.PerspectiveCamera(45, state.resolution.w / state.resolution.h, 0.01, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(state.resolution.w, state.resolution.h);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        ui.container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const keyLight = new THREE.DirectionalLight(0xfffaf0, 2.2);
        keyLight.position.set(5, 5, 5); keyLight.castShadow = true;
        scene.add(keyLight);
        scene.add(new THREE.DirectionalLight(0xd0e0ff, 1.0)).position.set(-5, 3, 3);

        let currentModel = null, audioContext, analyser, mediaStreamDest, dataArray;

        function resize() {
            const parent = ui.container.parentElement;
            const aspect = state.resolution.w / state.resolution.h;
            if (parent.clientWidth / parent.clientHeight > aspect) {
                ui.container.style.height = '88vh'; ui.container.style.width = `calc(88vh * ${aspect})`;
            } else {
                ui.container.style.width = '88vw'; ui.container.style.height = `calc(88vw / ${aspect})`;
            }
            camera.aspect = aspect; camera.updateProjectionMatrix();
            renderer.setSize(state.resolution.w, state.resolution.h);
        }
        window.addEventListener('resize', resize); resize();
        ui.res.addEventListener('change', e => { state.resolution = e.target.value === 'landscape' ? {w:1920, h:1080} : {w:1080, h:1920}; resize(); });
        ui.bg.addEventListener('input', e => scene.background.set(e.target.value));

        function centerAndFitModel() {
            if (!currentModel) return;
            ui.scale.value = 1; ui.posX.value = 0; ui.posY.value = 0; ui.posZ.value = 0;
            modelGroup.scale.set(1, 1, 1); modelGroup.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim === 0) return;

            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.4;
            camera.position.set(center.x, center.y + (size.y * 0.1), center.z + cameraZ);
            controls.target.set(center.x, center.y + (size.y * 0.2), center.z);
            camera.far = cameraZ * 10; camera.updateProjectionMatrix(); controls.update();
        }
        ui.centerBtn.addEventListener('click', centerAndFitModel);

        // ============================================================
        // ROBUST GLB RIG LOADER
        // Uses explicit semantic matching + hierarchy/side scoring.
        // ============================================================
        ui.glb.addEventListener('change', e => {
            const file = e.target.files?.[0];
            if (!file) return;

            ui.info.innerHTML = 'Parsing model and discovering rig...';
            const url = URL.createObjectURL(file);

            new GLTFLoader().load(
                url,
                gltf => {
                    try {
                        if (currentModel) modelGroup.remove(currentModel);

                        currentModel = gltf.scene;
                        modelGroup.add(currentModel);

                        state.morphMeshes = [];
                        state.bones = {};
                        state.initialBones = {};

                        const bones = [];
                        let blendshapeCount = 0;

                        currentModel.traverse(node => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                if (node.morphTargetDictionary) {
                                    state.morphMeshes.push(node);
                                    blendshapeCount += Object.keys(node.morphTargetDictionary).length;
                                }
                            }

                            if (node.isBone) {
                                bones.push(node);
                                state.initialBones[node.uuid] = {
                                    q: node.quaternion.clone(),
                                    p: node.position.clone(),
                                    s: node.scale.clone()
                                };
                            }
                        });

                        function n(name) {
                            return String(name || '')
                                .toLowerCase()
                                .replace(/[^a-z0-9]/g, '');
                        }

                        function sideOf(name) {
                            const s = String(name || '').toLowerCase();
                            const compact = n(s);

                            if (
                                /(^|[^a-z])(left|l)([^a-z]|$)/.test(s) ||
                                compact.includes('left') ||
                                compact.endsWith('l') ||
                                compact.includes('mixamorigtleft') ||
                                compact.includes('jbianl')
                            ) return 'L';

                            if (
                                /(^|[^a-z])(right|r)([^a-z]|$)/.test(s) ||
                                compact.includes('right') ||
                                compact.endsWith('r') ||
                                compact.includes('mixamorigright') ||
                                compact.includes('jbianr')
                            ) return 'R';

                            return null;
                        }

                        function semanticScore(bone, role) {
                            const name = n(bone.name);
                            const side = sideOf(bone.name);
                            const wantedSide = role.startsWith('l') ? 'L' : role.startsWith('r') ? 'R' : null;
                            const scores = {
                                hips: ['hips','pelvis','pelvic','mixamorig','root'],
                                spine: ['spine','spine1'],
                                chest: ['chest','upperchest','spine2','spine3'],
                                neck: ['neck'],
                                head: ['head'],
                                shoulder: ['shoulder','clavicle'],
                                arm: ['upperarm','upper_arm','arm'],
                                fore: ['forearm','lowerarm','lower_arm','elbow'],
                                hand: ['hand','wrist'],
                                eye: ['eye']
                            };

                            const group =
                                role.includes('shoulder') ? 'shoulder' :
                                role.endsWith('arm') ? 'arm' :
                                role.endsWith('fore') ? 'fore' :
                                role.endsWith('hand') ? 'hand' :
                                role.endsWith('eye') ? 'eye' : role;

                            let score = 0;
                            for (const term of (scores[group] || [])) {
                                if (name === term) score += 120;
                                else if (name.includes(term)) score += term.length >= 5 ? 70 : 35;
                            }

                            if (wantedSide) {
                                if (side === wantedSide) score += 160;
                                else if (side && side !== wantedSide) score -= 500;
                            }

                            // Reject obvious neighboring roles.
                            if (role.endsWith('arm') && (name.includes('forearm') || name.includes('lowerarm'))) score -= 100;
                            if (role.endsWith('fore') && name.includes('upperarm')) score -= 100;
                            if (role.endsWith('hand') && (name.includes('forearm') || name.includes('upperarm'))) score -= 100;
                            if (role === 'spine' && (name.includes('chest') || name.includes('upperchest'))) score -= 100;
                            if (role === 'chest' && name === 'spine') score -= 30;

                            return score;
                        }

                        function nearestAncestorRole(bone, roleName) {
                            let p = bone.parent;
                            let hops = 0;
                            while (p && hops < 8) {
                                const pn = n(p.name);
                                if (pn.includes(roleName)) return true;
                                p = p.parent;
                                hops++;
                            }
                            return false;
                        }

                        function chooseRole(role, used) {
                            let best = null;
                            let bestScore = -Infinity;

                            for (const bone of bones) {
                                if (used.has(bone.uuid)) continue;

                                let score = semanticScore(bone, role);

                                if (role === 'lShoulder' || role === 'rShoulder') {
                                    if (nearestAncestorRole(bone, 'shoulder')) score += 20;
                                }
                                if (role === 'lFore' || role === 'rFore') {
                                    if (nearestAncestorRole(bone, 'arm')) score += 10;
                                }

                                if (score > bestScore) {
                                    bestScore = score;
                                    best = bone;
                                }
                            }

                            return bestScore >= 45 ? best : null;
                        }

                        const used = new Set();
                        const roles = [
                            'hips','spine','chest','neck','head',
                            'lShoulder','rShoulder','lArm','rArm',
                            'lFore','rFore','lHand','rHand','lEye','rEye'
                        ];

                        for (const role of roles) {
                            const bone = chooseRole(role, used);
                            if (bone) {
                                state.bones[role] = bone;
                                used.add(bone.uuid);
                            }
                        }

                        const mapped = Object.entries(state.bones)
                            .map(([role, bone]) => `${role}: ${bone.name}`)
                            .join('<br>');

                        const required = ['lArm','rArm','lFore','rFore'];
                        const missing = required.filter(k => !state.bones[k]);

                        // Reset to true bind/local pose before preview starts.
                        for (const bone of bones) {
                            const original = state.initialBones[bone.uuid];
                            bone.quaternion.copy(original.q);
                            bone.position.copy(original.p);
                            bone.scale.copy(original.s);
                        }

                        currentModel.updateMatrixWorld(true);

                        if (missing.length) {
                            ui.info.innerHTML =
                                `<span class="warning">Model loaded, but required animation bones are missing.<br>` +
                                `Missing: ${missing.join(', ')}<br><small>${mapped || 'No compatible bones found.'}</small></span>`;
                        } else {
                            ui.info.innerHTML =
                                `<span class="success">Rig ready — ${Object.keys(state.bones).length} bones mapped.<br>` +
                                `<small>${mapped}</small></span>`;
                        }

                        console.table(
                            Object.fromEntries(
                                Object.entries(state.bones).map(([k,b]) => [k, b.name])
                            )
                        );
                        console.log('Total bones:', bones.length);
                        console.log('Morph targets:', blendshapeCount);

                        ui.centerBtn.disabled = false;
                        centerAndFitModel();
                        ui.rec.disabled = false;

                    } finally {
                        URL.revokeObjectURL(url);
                    }
                },
                undefined,
                error => {
                    console.error('GLB load failed:', error);
                    ui.info.innerHTML = `<span class="error">Could not load GLB: ${error?.message || error}</span>`;
                    URL.revokeObjectURL(url);
                }
            );
        });

        ui.audio.addEventListener('change', async e => {
            const file = e.target.files?.[0];
            if (!file) return;

            try {
                stopPlayback(false);

                if (audioObjectUrl) {
                    URL.revokeObjectURL(audioObjectUrl);
                    audioObjectUrl = null;
                }

                audioObjectUrl = URL.createObjectURL(file);
                audioElement.src = audioObjectUrl;
                audioElement.load();
                await setupAudioGraph();

                ui.info.innerHTML = `<span class="success">Audio loaded: ${file.name}</span>`;
                console.log('Audio loaded:', file.name, file.size, 'bytes');
            } catch (error) {
                console.error('Audio initialization failed:', error);
                alert('Could not initialize the audio file.\n\n' + error.message);
            }
        });

        // ============================================================
        // DETERMINISTIC RIG + TIMELINE ENGINE
        // ============================================================
        function cleanName(n) {
            return String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        function setMorphUniversal(mesh, searchNames, value, speed = 0.4) {
            if (!mesh.morphTargetDictionary || !mesh.morphTargetInfluences) return;

            const keys = Object.keys(mesh.morphTargetDictionary);
            const target = THREE.MathUtils.clamp(Number(value) || 0, 0, 1);

            for (const search of searchNames) {
                const cleanSearch = cleanName(search);
                for (const key of keys) {
                    const ck = cleanName(key);
                    if (ck === cleanSearch || (cleanSearch.length > 2 && ck.includes(cleanSearch))) {
                        const idx = mesh.morphTargetDictionary[key];
                        mesh.morphTargetInfluences[idx] = THREE.MathUtils.lerp(
                            mesh.morphTargetInfluences[idx],
                            target,
                            speed
                        );
                        break;
                    }
                }
            }
        }

        // Apply local rotation relative to the model's actual bind/local rotation.
        function applyBoneOffset(role, x = 0, y = 0, z = 0) {
            const bone = state.bones[role];
            if (!bone) return;

            const original = state.initialBones[bone.uuid];
            if (!original) return;

            const qOffset = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(x, y, z, 'XYZ')
            );

            bone.quaternion.copy(original.q).multiply(qOffset);
        }

        function applyBonePose(pose) {
            // IMPORTANT: always start from original bind/local rotations.
            // This prevents previous frames from accumulating into the next frame.
            applyBoneOffset('lShoulder', pose.lSP, pose.lSY, pose.lSR);
            applyBoneOffset('lArm',      pose.lAP, pose.lAY, pose.lAR);
            applyBoneOffset('lFore',     pose.lFP, pose.lFY, 0);
            applyBoneOffset('lHand',     pose.lHP, 0,        pose.lHR);

            applyBoneOffset('rShoulder', pose.rSP, pose.rSY, pose.rSR);
            applyBoneOffset('rArm',      pose.rAP, pose.rAY, -pose.rAR);
            applyBoneOffset('rFore',     pose.rFP, pose.rFY, 0);
            applyBoneOffset('rHand',     pose.rHP, 0,        -pose.rHR);
        }

        function applyProceduralOffset(role, x = 0, y = 0, z = 0) {
            const bone = state.bones[role];
            if (!bone) return;

            const q = new THREE.Quaternion().setFromEuler(
                new THREE.Euler(x, y, z, 'XYZ')
            );
            bone.quaternion.multiply(q);
        }

        function getTargetPoseAtTime(t) {
            if (state.editingBlockId && !state.isPlaying) {
                const editing = state.blocks.find(b => b.id === state.editingBlockId);
                if (editing) return { ...BaseRest, ...editing.customPose };
            }

            // Sort once through renderTimeline; still iterate deterministically.
            for (const block of state.blocks) {
                const start = Number(block.start);
                const end = Number(block.end);
                if (Number.isFinite(start) && Number.isFinite(end) && t >= start && t < end) {
                    return { ...BaseRest, ...block.customPose };
                }
            }

            return { ...BaseRest };
        }

        function setTimelineTime(time, exact = false) {
            const duration = getTimelineDuration();
            const t = THREE.MathUtils.clamp(Number(time) || 0, 0, Math.max(duration, 0));
            state.audioTime = t;
            state.timelineClock = t;

            const target = getTargetPoseAtTime(t);

            if (exact) {
                state.smoothPose = { ...target };
            } else {
                const dt = Math.min(Math.max(clock.getDelta(), 0), 0.05);
                const alpha = 1 - Math.exp(-16 * dt);
                for (const key of Object.keys(BaseRest)) {
                    const tv = Number(target[key] ?? 0);
                    state.smoothPose[key] = THREE.MathUtils.lerp(
                        Number(state.smoothPose[key] ?? 0),
                        tv,
                        alpha
                    );
                }
            }

            applyBonePose(state.smoothPose);
        }

        function applyCurrentFrame(delta) {
            if (!currentModel) return;

            const t = state.isPlaying ? state.timelineClock : state.audioTime;
            const target = getTargetPoseAtTime(t);

            // No hidden audio dependency. Timeline directly controls pose.
            if (state.isPlaying) {
                // Smooth block changes, but never lose the target pose.
                const alpha = 1 - Math.exp(-18 * Math.min(delta, 0.05));
                for (const key of Object.keys(BaseRest)) {
                    const tv = Number(target[key] ?? 0);
                    state.smoothPose[key] = THREE.MathUtils.lerp(
                        Number(state.smoothPose[key] ?? 0),
                        tv,
                        alpha
                    );
                }
            } else {
                state.smoothPose = { ...target };
            }

            // BASE TIMELINE POSE
            applyBonePose(state.smoothPose);

            // PROCEDURAL LAYER
            const swayAmp = parseFloat(ui.animSway.value) || 1;
            const lifeTime = t;

            const breath = Math.sin(lifeTime * 1.8) * 0.015 * swayAmp;
            const swayX = Math.sin(lifeTime * 0.4) * 0.03 * swayAmp;
            const talk = state.speechEnergy;

            if (state.bones.hips) {
                const shift = Math.sin(lifeTime * 0.4) * 0.015 * swayAmp;
                applyBoneOffset('hips', 0, 0, -shift * 2);
                applyProceduralOffset('hips', 0, 0, 0);
            }

            applyProceduralOffset('spine', breath, 0, swayX);
            applyProceduralOffset('chest', breath * 1.5, 0, swayX * 0.5);

            const nod = Math.sin(lifeTime * 3) * 0.03 * talk + breath * 0.5;
            applyProceduralOffset('neck', nod, 0, -swayX);
            applyProceduralOffset('head', nod, 0, 0);

            // Eyes: use a small deterministic movement, not random per frame.
            const eyeX = Math.sin(lifeTime * 0.7) * 0.08;
            const eyeY = Math.sin(lifeTime * 0.47) * 0.05;
            applyBoneOffset('lEye', eyeY, eyeX, 0);
            applyBoneOffset('rEye', eyeY, eyeX, 0);

            // Mouth / facial animation.
            const mouthMax = parseFloat(ui.mouthAmp.value) || 0.8;
            for (const mesh of state.morphMeshes) {
                const jaw = state.isPlaying ? state.speechEnergy * 2.5 * mouthMax : 0;
                const vowel = state.isPlaying ? state.speechEnergy * mouthMax : 0;

                setMorphUniversal(mesh,
                    ['jawopen','mouthopen','visemeaa','vrcvaa','fclmtha','a','ah'],
                    jaw, 0.35
                );

                setMorphUniversal(mesh,
                    ['mouthfunnel','visemeu','visemeo','vrcvoh','fclmtho','o','u','oo','pucker'],
                    vowel, 0.3
                );

                setMorphUniversal(mesh,
                    ['mouthsmileleft','mouthsmileright','smile','fclmthe','e','ee'],
                    state.isPlaying ? 0.08 + state.speechEnergy * 0.25 : 0.05,
                    0.2
                );
            }

            // Force the skeleton and skinned meshes to consume the new bone transforms.
            currentModel.updateMatrixWorld(true);
        }

        // ============================================================
        // AUDIO / TIMELINE PLAYBACK
        // ============================================================
        const timelineClock = {
            running: false,
            base: 0,
            epoch: 0,
            duration: 0
        };

        async function startTimelinePlayback() {
            if (state.isPlaying) return;

            const duration = getTimelineDuration();
            if (duration <= 0) {
                alert('Add a timeline block or load an audio file first.');
                return;
            }

            await setupAudioGraph();

            if (state.audioTime >= duration - 0.02) {
                state.audioTime = 0;
            }

            if (state.editingBlockId) closePoseEditor();

            timelineClock.base = state.audioTime;
            timelineClock.epoch = performance.now();
            timelineClock.duration = duration;
            timelineClock.running = true;

            state.playBaseTime = timelineClock.base;
            state.playEpoch = timelineClock.epoch;
            state.isPlaying = true;
            state.isRecording = false;

            ui.play.innerText = 'Pause Timeline';
            setTimelineTime(timelineClock.base, true);

            if (audioElement.src) {
                try {
                    audioElement.currentTime = timelineClock.base;
                    await audioElement.play();
                } catch (err) {
                    console.warn('Audio play blocked:', err);
                    // The animation still works even if audio playback is blocked.
                }
            }
        }

        function stopPlayback(reset = false) {
            state.isPlaying = false;
            timelineClock.running = false;
            ui.play.innerText = 'Play Timeline';

            try { audioElement.pause(); } catch (e) {}

            if (reset) {
                state.audioTime = 0;
                state.timelineClock = 0;
                state.smoothPose = { ...BaseRest };
                try { audioElement.currentTime = 0; } catch (e) {}
            }
        }

        // ============================================================
        // MAIN RENDER LOOP
        // ============================================================
        const clock = new THREE.Clock();
        let lastFrameNow = performance.now();
        let audioCorrectionAt = 0;

        function animate(now = performance.now()) {
            requestAnimationFrame(animate);

            const delta = Math.min((now - lastFrameNow) / 1000, 0.05);
            lastFrameNow = now;

            state.time += delta;

            if (currentModel) {
                modelGroup.scale.setScalar(parseFloat(ui.scale.value) || 1);
                modelGroup.position.set(
                    parseFloat(ui.posX.value) || 0,
                    parseFloat(ui.posY.value) || 0,
                    parseFloat(ui.posZ.value) || 0
                );
            }

            if (state.isPlaying) {
                const elapsed = Math.max(0, (now - timelineClock.epoch) / 1000);
                const nextTime = timelineClock.base + elapsed;
                const duration = getTimelineDuration();
                state.timelineClock = Math.min(nextTime, duration);
                state.audioTime = state.timelineClock;

                // Do NOT seek audio every frame. Only use a very occasional
                // soft correction if it drifts noticeably.
                if (
                    audioElement.src &&
                    audioElement.readyState >= 2 &&
                    audioElement.paused === false &&
                    now - audioCorrectionAt > 750
                ) {
                    audioCorrectionAt = now;
                    const drift = audioElement.currentTime - state.audioTime;
                    if (Math.abs(drift) > 0.20) {
                        timelineClock.epoch = now - (audioElement.currentTime - timelineClock.base) * 1000;
                        state.timelineClock = audioElement.currentTime;
                        state.audioTime = audioElement.currentTime;
                    }
                }

                if (duration > 0 && state.timelineClock >= duration) {
                    state.timelineClock = duration;
                    state.audioTime = duration;
                    applyCurrentFrame(delta);

                    if (!state.isRecording) {
                        stopPlayback(false);
                    }
                }
            }

            // Analyser is independent of the timeline pose engine.
            let vocalEnergy = 0;
            if (
                state.isPlaying &&
                analyser &&
                dataArray &&
                audioElement.readyState >= 2
            ) {
                analyser.getByteFrequencyData(dataArray);
                for (let i = 2; i < Math.min(20, dataArray.length); i++) {
                    vocalEnergy += dataArray[i];
                }
                vocalEnergy = (vocalEnergy / 18) / 255;
                state.speechEnergy = THREE.MathUtils.lerp(
                    state.speechEnergy,
                    THREE.MathUtils.clamp(vocalEnergy, 0, 1),
                    0.18
                );
            } else {
                state.speechEnergy = THREE.MathUtils.lerp(
                    state.speechEnergy,
                    0,
                    0.10
                );
            }

            if (currentModel) {
                applyCurrentFrame(delta);
            }

            updateAudioUI(state.audioTime);

            // Clear, frame-accurate playback diagnostic.
            if (state.isPlaying && ui.info) {
                const active = state.blocks.find(b =>
                    state.audioTime >= Number(b.start) &&
                    state.audioTime < Number(b.end)
                );
                ui.info.dataset.playback = active
                    ? `PLAYING ${active.label} @ ${state.audioTime.toFixed(2)}s`
                    : `PLAYING REST @ ${state.audioTime.toFixed(2)}s`;
            }

            controls.update();
            renderer.render(scene, camera);

            // Export completion is handled from the same render loop, so the
            // last rendered frame is guaranteed to be included in the stream.
            if (state.isRecording && state.isPlaying) {
                const duration = getTimelineDuration();
                if (duration > 0 && state.audioTime >= duration) {
                    stopRecording();
                }
            }
        }

        requestAnimationFrame(animate);

        // ============================================================
        // ROBUST VIDEO EXPORT ENGINE
        // ============================================================
        let mediaRecorder = null;
        let recordingChunks = [];
        let exportCanvasStream = null;
        let exportStream = null;
        let exportMonitorTimer = null;

        function getSupportedRecordingFormat() {
            const candidates = [
                { mimeType: 'video/webm;codecs=vp9,opus', extension: 'webm', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 },
                { mimeType: 'video/webm;codecs=vp8,opus', extension: 'webm', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 },
                { mimeType: 'video/webm', extension: 'webm', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 },
                { mimeType: 'video/mp4', extension: 'mp4', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 }
            ];

            for (const candidate of candidates) {
                if (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(candidate.mimeType)) {
                    return candidate;
                }
            }

            return { mimeType: '', extension: 'webm', videoBitsPerSecond: 8000000, audioBitsPerSecond: 128000 };
        }

        function validateRecordingStream(stream) {
            const videoTracks = stream.getVideoTracks();
            const audioTracks = stream.getAudioTracks();

            console.log('Export stream:', {
                videoTracks: videoTracks.length,
                audioTracks: audioTracks.length,
                videoTrackStates: videoTracks.map(t => ({ readyState: t.readyState, enabled: t.enabled })),
                audioTrackStates: audioTracks.map(t => ({ readyState: t.readyState, enabled: t.enabled }))
            });

            if (videoTracks.length === 0) throw new Error('Canvas video track was not created.');
            if (videoTracks[0].readyState !== 'live') throw new Error('Canvas video track is not live.');
            return true;
        }

        function resetExportUI() {
            state.isRecording = false;
            state.isPlaying = false;
            ui.rec.disabled = false;
            ui.rec.innerText = 'Record & Export Video';
            ui.rec.style.backgroundColor = 'var(--danger-color)';
        }

        ui.rec.addEventListener('click', async () => {
            if (state.isRecording) await stopRecording();
            else await startRecording();
        });

        async function startRecording() {
            if (!currentModel) {
                alert('Please load a 3D model before exporting.');
                return;
            }

            if (typeof MediaRecorder === 'undefined') {
                alert('This browser does not support MediaRecorder.');
                return;
            }

            try {
                await setupAudioGraph();

                if (audioContext && audioContext.state === 'suspended') await audioContext.resume();

                const duration = getTimelineDuration();
                if (duration <= 0) {
                    alert('Timeline has no duration. Load audio or create timeline blocks first.');
                    return;
                }

                stopPlayback(false);
                seekAudio(0);

                // Ensure one fresh video stream per export.
                exportCanvasStream = renderer.domElement.captureStream(30);
                if (!exportCanvasStream) throw new Error('Canvas captureStream() is not available.');

                const videoTracks = exportCanvasStream.getVideoTracks();
                const audioTracks = mediaStreamDest ? mediaStreamDest.stream.getAudioTracks() : [];

                exportStream = new MediaStream();
                videoTracks.forEach(track => exportStream.addTrack(track));
                audioTracks.forEach(track => exportStream.addTrack(track));

                validateRecordingStream(exportStream);

                const format = getSupportedRecordingFormat();
                const recorderOptions = { videoBitsPerSecond: format.videoBitsPerSecond };
                if (format.audioBitsPerSecond) recorderOptions.audioBitsPerSecond = format.audioBitsPerSecond;
                if (format.mimeType) recorderOptions.mimeType = format.mimeType;

                try {
                    mediaRecorder = new MediaRecorder(exportStream, recorderOptions);
                } catch (error) {
                    console.warn('Preferred recorder failed, using fallback:', error);
                    mediaRecorder = new MediaRecorder(exportStream);
                }

                recordingChunks = [];

                mediaRecorder.onstart = () => {
                    console.log('MediaRecorder started:', mediaRecorder.mimeType);
                };

                mediaRecorder.ondataavailable = event => {
                    if (event.data && event.data.size > 0) {
                        recordingChunks.push(event.data);
                        console.log('Recorder chunk:', event.data.size, 'bytes');
                    }
                };

                mediaRecorder.onerror = event => {
                    console.error('MediaRecorder error:', event);
                    resetExportUI();
                    alert('Video recording failed. Check the browser console for details.');
                };

                mediaRecorder.onstop = () => {
                    finalizeRecording();
                };

                // Start recording BEFORE starting audio playback.
                mediaRecorder.start(250);

                state.isRecording = true;
                ui.rec.disabled = true;
                ui.rec.innerText = 'Exporting...';
                ui.rec.style.backgroundColor = '#6c757d';

                // Give the browser one frame to initialize the capture stream.
                await new Promise(resolve => requestAnimationFrame(resolve));
                await new Promise(resolve => setTimeout(resolve, 100));

                state.audioTime = 0;
                state.timelineClock = 0;
                timelineClock.base = 0;
                timelineClock.epoch = performance.now();
                timelineClock.duration = duration;
                timelineClock.running = true;
                state.playBaseTime = 0;
                state.playEpoch = timelineClock.epoch;
                state.isPlaying = true;
                applyCurrentFrame(0.016);

                if (audioElement.src) {
                    audioElement.currentTime = 0;
                    try { await audioElement.play(); } catch (e) { console.warn('Export audio play blocked:', e); }
                }

                console.log('Export started. Duration:', duration);

                // Export completion is driven by the SAME master timeline clock
                // used by the preview animation. No second timer is needed.

            } catch (error) {
                console.error('EXPORT START FAILED:', error);
                resetExportUI();
                alert('Export failed to start.\n\n' + error.message);
            }
        }

        async function stopRecording() {
            if (!mediaRecorder) {
                resetExportUI();
                return;
            }

            if (exportMonitorTimer) {
                clearInterval(exportMonitorTimer);
                exportMonitorTimer = null;
            }

            state.isRecording = false;

            if (audioElement.src) {
                try { audioElement.pause(); } catch (e) {}
            }

            ui.rec.disabled = true;
            ui.rec.innerText = 'Finalizing...';

            if (mediaRecorder.state !== 'inactive') {
                try { mediaRecorder.requestData(); } catch (e) { console.warn('requestData failed:', e); }
                mediaRecorder.stop();
            } else {
                finalizeRecording();
            }
        }

        function finalizeRecording() {
            try {
                const mimeType = mediaRecorder?.mimeType || 'video/webm';
                const blob = new Blob(recordingChunks, { type: mimeType });

                console.log('FINAL EXPORT:', {
                    size: blob.size,
                    sizeMB: (blob.size / 1024 / 1024).toFixed(2),
                    mimeType,
                    chunks: recordingChunks.length
                });

                if (blob.size < 10000 || recordingChunks.length === 0) {
                    alert('Export produced an empty or very small file. Keep this tab visible during export and check the browser console for recorder diagnostics.');
                    return;
                }

                const extension = mimeType.includes('mp4') ? 'mp4' : 'webm';
                const blobUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `avatar_cinematic_${Date.now()}.${extension}`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);

                ui.info.innerHTML = `<span class="success">Export successful: ${(blob.size / 1024 / 1024).toFixed(2)} MB</span>`;
                console.log(`Export successful: ${(blob.size / 1024 / 1024).toFixed(2)} MB`);

            } catch (error) {
                console.error('FINALIZE EXPORT ERROR:', error);
                alert('Could not finalize the exported video.\n\n' + error.message);
            } finally {
                if (exportStream) {
                    exportStream.getTracks().forEach(track => {
                        try { track.stop(); } catch (e) {}
                    });
                }

                if (exportCanvasStream) {
                    exportCanvasStream.getTracks().forEach(track => {
                        try { track.stop(); } catch (e) {}
                    });
                }

                exportStream = null;
                exportCanvasStream = null;
                mediaRecorder = null;
                recordingChunks = [];
                resetExportUI();
            }
        }

        ui.theme.addEventListener('click', () => document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
</html>
