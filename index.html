<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Avatar Studio</title>
    <style>
        :root {
            --bg-color: #f4f4f9; --panel-bg: #ffffff; --text-color: #333333;
            --border-color: #cccccc; --accent-color: #007bff; --accent-hover: #0056b3;
            --danger-color: #dc3545; --section-bg: #eef2f5;
        }
        [data-theme="dark"] {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --border-color: #333333; --accent-color: #3f51b5; --accent-hover: #2c387e;
            --section-bg: #252525;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar layout fixes */
        #sidebar {
            width: 420px; min-width: 420px; background-color: var(--panel-bg); 
            border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10;
        }
        
        .tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .tab-btn { flex: 1; padding: 15px 10px; background: none; border: none; color: var(--text-color); font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.2s; }
        .tab-btn.active { border-bottom: 3px solid var(--accent-color); color: var(--accent-color); background: var(--section-bg); }
        .tab-btn:hover { background: var(--section-bg); }

        .tab-content { padding: 20px; overflow-y: auto; flex-grow: 1; display: none; flex-direction: column; gap: 15px; }
        .tab-content.active { display: flex; }

        .control-group { display: flex; flex-direction: column; gap: 4px; }
        .row-group { display: flex; gap: 10px; align-items: center; }
        .panel-section { background: var(--section-bg); padding: 15px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 10px; }
        
        label { font-size: 0.85em; font-weight: bold; }
        .sub-label { font-size: 0.75em; color: gray; font-weight: normal; margin-top:-3px; }
        
        input[type="file"], input[type="color"], input[type="number"], select {
            width: 100%; padding: 8px; background-color: var(--bg-color); color: var(--text-color);
            border: 1px solid var(--border-color); border-radius: 4px;
        }
        input[type="range"] { width: 100%; cursor: pointer; }
        
        button { padding: 10px; border: none; border-radius: 4px; background-color: var(--accent-color); color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: var(--accent-hover); }
        button:disabled { background-color: var(--border-color); cursor: not-allowed; opacity: 0.6; }
        
        #btnRecord { background-color: var(--danger-color); margin-top: 5px; }
        #btnCenter { background-color: #28a745; margin-bottom: 10px; }
        #btnCenter:hover { background-color: #218838; }

        /* Timeline UI */
        .timeline-adder { display: flex; gap: 10px; align-items: flex-end; }
        #timelineList { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .tl-item { background: var(--bg-color); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
        .tl-remove { background: transparent; color: var(--danger-color); border: 1px solid var(--danger-color); padding: 4px 8px; font-size: 0.8em; }
        .tl-remove:hover { background: var(--danger-color); color: white; }

        #diagnostics { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 4px; padding: 10px; font-size: 0.75em; max-height: 120px; overflow-y: auto; }
        .success { color: #28a745; font-weight:bold; } .warning { color: #ffc107; font-weight:bold; } .error { color: #dc3545; font-weight:bold; }
        
        #main-content { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px; background-color: var(--bg-color); }
        #canvas-container { position: relative; background-color: #00ff00; box-shadow: 0 4px 20px rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden; }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        .theme-toggle { position: absolute; top: 20px; right: 20px; z-index: 100; padding: 6px 12px; font-size: 0.8em; }
        .time-display { position: absolute; top: 20px; left: 20px; z-index: 100; padding: 6px 12px; background: rgba(0,0,0,0.6); color: white; border-radius: 4px; font-family: monospace; font-size: 1.1em; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body data-theme="dark">

    <div id="sidebar">
        <div class="tabs">
            <button class="tab-btn active" data-target="tab-setup">1. Model & Setup</button>
            <button class="tab-btn" data-target="tab-timeline">2. Pose Timeline</button>
        </div>

        <!-- TAB 1: SETUP -->
        <div id="tab-setup" class="tab-content active">
            <div class="control-group">
                <label>Load 3D Model (.glb)</label>
                <input type="file" id="glbInput" accept=".glb">
            </div>
            
            <div id="diagnostics"><div id="model-info">Upload a model to initialize...</div></div>

            <div class="control-group">
                <label>Load Audio Speech Track</label>
                <input type="file" id="audioInput" accept="audio/*">
            </div>

            <div class="panel-section">
                <label style="color: var(--accent-color);">Framing & Positioning</label>
                <button id="btnCenter" disabled>🎯 Center & Fit Model</button>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Scale</label><input type="range" id="modScale" min="0.1" max="5" step="0.05" value="1"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Up / Down</label><input type="range" id="modPosY" min="-5" max="5" step="0.1" value="0"></div>
                </div>
                <div class="row-group">
                    <div class="control-group" style="flex:1;"><label class="sub-label">Left / Right</label><input type="range" id="modPosX" min="-5" max="5" step="0.1" value="0"></div>
                    <div class="control-group" style="flex:1;"><label class="sub-label">Near / Far</label><input type="range" id="modPosZ" min="-5" max="5" step="0.1" value="0"></div>
                </div>
            </div>

            <div class="panel-section">
                <label style="color: var(--accent-color);">Export Settings</label>
                <div class="row-group">
                    <div class="control-group" style="flex: 1;"><label class="sub-label">Background</label><input type="color" id="bgColor" value="#00ff00"></div>
                    <div class="control-group" style="flex: 1;">
                        <label class="sub-label">Format</label>
                        <select id="resolution">
                            <option value="landscape">16:9 (HD)</option>
                            <option value="portrait">9:16 (Shorts)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- TAB 2: TIMELINE -->
        <div id="tab-timeline" class="tab-content">
            <div class="panel-section">
                <label style="color: var(--accent-color);">Add Pose to Timeline</label>
                <div class="timeline-adder">
                    <div class="control-group" style="flex: 1;">
                        <label class="sub-label">Time (Seconds)</label>
                        <input type="number" id="tlTime" min="0" step="0.5" value="0">
                    </div>
                    <div class="control-group" style="flex: 2;">
                        <label class="sub-label">Select Pose</label>
                        <select id="tlPose">
                            <option value="rest_straight">Stand Straight (Rest)</option>
                            <option value="rest_relaxed">Stand Relaxed (Hands folded)</option>
                            <option value="explain_open">Explain: Both Hands Open</option>
                            <option value="explain_right">Explain: Right Hand Up</option>
                            <option value="explain_left">Explain: Left Hand Up</option>
                            <option value="thinking">Thinking (Hand on Chin)</option>
                            <option value="hands_hips">Hands on Hips</option>
                        </select>
                    </div>
                </div>
                <button id="btnAddTimeline">➕ Add to Timeline</button>
            </div>

            <div class="panel-section">
                <label style="color: var(--accent-color);">Current Timeline</label>
                <div id="timelineList">
                    <!-- Timeline items injected here -->
                </div>
            </div>

            <div class="panel-section" style="margin-top: auto;">
                <label class="sub-label">Mouth Lip-Sync Intensity</label>
                <input type="range" id="mouthAmp" min="0" max="2" step="0.05" value="0.8">
                
                <button id="btnPlayPause" disabled style="margin-top: 10px;">Play / Pause Audio</button>
                <button id="btnRecord" disabled>Record & Export Video</button>
            </div>
        </div>
    </div>

    <div id="main-content">
        <button class="theme-toggle" id="btnTheme">Toggle Theme</button>
        <div class="time-display" id="timeDisplay">Time: 0.0s</div>
        <div id="canvas-container"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- TIMELINE POSES DICTIONARY (Euler Offsets: Pitch, Yaw, Roll) ---
        // Rotations are approximate offsets from a standard T/A pose.
        const PoseLibrary = {
            rest_straight: {
                lShoulder: [0,0,0], rShoulder: [0,0,0],
                lArm: [0.1, 0, 0.15], rArm: [0.1, 0, -0.15],
                lFore: [0.1, 0, 0], rFore: [0.1, 0, 0],
                lHand: [0,0,0], rHand: [0,0,0]
            },
            rest_relaxed: {
                lShoulder: [0,0,0.05], rShoulder: [0,0,-0.05],
                lArm: [0.2, 0, 0.1], rArm: [0.2, 0, -0.1],
                lFore: [0.4, 0.2, 0], rFore: [0.4, -0.2, 0],
                lHand: [0,0,0], rHand: [0,0,0]
            },
            explain_open: {
                lShoulder: [0.1, 0, 0.05], rShoulder: [0.1, 0, -0.05],
                lArm: [0.4, 0, 0.3], rArm: [0.4, 0, -0.3],
                lFore: [1.2, 0.4, 0], rFore: [1.2, -0.4, 0],
                lHand: [-0.2, 0, 0.1], rHand: [-0.2, 0, -0.1]
            },
            explain_right: {
                lShoulder: [0, 0, 0], rShoulder: [0.15, 0, -0.05],
                lArm: [0.1, 0, 0.1], rArm: [0.6, 0, -0.3],
                lFore: [0.1, 0, 0], rFore: [1.4, -0.5, 0],
                lHand: [0,0,0], rHand: [-0.2, 0, -0.1]
            },
            explain_left: {
                lShoulder: [0.15, 0, 0.05], rShoulder: [0, 0, 0],
                lArm: [0.6, 0, 0.3], rArm: [0.1, 0, -0.1],
                lFore: [1.4, 0.5, 0], rFore: [0.1, 0, 0],
                lHand: [-0.2, 0, 0.1], rHand: [0,0,0]
            },
            thinking: {
                lShoulder: [0, 0, 0], rShoulder: [0.1, 0, 0],
                lArm: [0.1, 0, 0.15], rArm: [0.8, -0.5, -0.1],
                lFore: [0.1, 0, 0], rFore: [2.1, -0.5, 0],
                lHand: [0,0,0], rHand: [-0.1, 0, 0]
            },
            hands_hips: {
                lShoulder: [0, 0, 0], rShoulder: [0, 0, 0],
                lArm: [0.2, 0, 0.5], rArm: [0.2, 0, -0.5],
                lFore: [1.0, 0.8, 0], rFore: [1.0, -0.8, 0],
                lHand: [-0.4, 0, 0], rHand: [-0.4, 0, 0]
            }
        };

        const state = {
            isPlaying: false, isRecording: false, resolution: { w: 1920, h: 1080 },
            morphMeshes: [], bones: {}, initialBones: {},
            time: 0, audioTime: 0, speechEnergy: 0,
            eyeTarget: new THREE.Vector2(0, 0), currentEyePos: new THREE.Vector2(0, 0), nextSaccadeTime: 0,
            blinkTimer: 0, nextBlinkTime: 2.0, isBlinkingNow: 0,
            // Timeline state
            timeline: [{ time: 0, pose: 'rest_straight' }],
            currentPoseName: 'rest_straight'
        };

        // --- UI BINDINGS ---
        const ui = {
            glb: document.getElementById('glbInput'), audio: document.getElementById('audioInput'),
            bg: document.getElementById('bgColor'), res: document.getElementById('resolution'),
            play: document.getElementById('btnPlayPause'), rec: document.getElementById('btnRecord'),
            centerBtn: document.getElementById('btnCenter'), theme: document.getElementById('btnTheme'),
            container: document.getElementById('canvas-container'), info: document.getElementById('model-info'),
            mouthAmp: document.getElementById('mouthAmp'), timeDisp: document.getElementById('timeDisplay'),
            scale: document.getElementById('modScale'), posX: document.getElementById('modPosX'), posY: document.getElementById('modPosY'), posZ: document.getElementById('modPosZ'),
            
            // Timeline UI
            tlTime: document.getElementById('tlTime'), tlPose: document.getElementById('tlPose'),
            btnAddTl: document.getElementById('btnAddTimeline'), tlList: document.getElementById('timelineList'),
            tabs: document.querySelectorAll('.tab-btn'), tabContents: document.querySelectorAll('.tab-content')
        };

        // --- TABS LOGIC ---
        ui.tabs.forEach(btn => {
            btn.addEventListener('click', () => {
                ui.tabs.forEach(t => t.classList.remove('active'));
                ui.tabContents.forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.getAttribute('data-target')).classList.add('active');
            });
        });

        // --- TIMELINE RENDERER ---
        function renderTimeline() {
            // Sort timeline by time
            state.timeline.sort((a, b) => a.time - b.time);
            ui.tlList.innerHTML = '';
            
            state.timeline.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'tl-item';
                
                const poseLabel = ui.tlPose.querySelector(`option[value="${item.pose}"]`).text;
                div.innerHTML = `<span><b>${item.time.toFixed(1)}s</b> - ${poseLabel}</span>`;
                
                // Don't allow deleting the baseline 0s pose
                if (index !== 0 || item.time !== 0) {
                    const btn = document.createElement('button');
                    btn.className = 'tl-remove'; btn.innerText = 'X';
                    btn.onclick = () => { state.timeline.splice(index, 1); renderTimeline(); };
                    div.appendChild(btn);
                } else {
                    div.innerHTML += `<span style="font-size:0.8em; color:gray;">(Base)</span>`;
                }
                
                ui.tlList.appendChild(div);
            });
        }
        renderTimeline();

        ui.btnAddTl.addEventListener('click', () => {
            const time = parseFloat(ui.tlTime.value);
            const pose = ui.tlPose.value;
            // Prevent exact duplicates
            const existing = state.timeline.findIndex(t => t.time === time);
            if(existing >= 0) state.timeline[existing].pose = pose;
            else state.timeline.push({ time, pose });
            renderTimeline();
        });

        // --- THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(ui.bg.value);
        const modelGroup = new THREE.Group();
        scene.add(modelGroup);

        const camera = new THREE.PerspectiveCamera(45, state.resolution.w / state.resolution.h, 0.01, 5000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setSize(state.resolution.w, state.resolution.h);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        ui.container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const keyLight = new THREE.DirectionalLight(0xfffaf0, 2.2);
        keyLight.position.set(5, 5, 5); keyLight.castShadow = true;
        scene.add(keyLight);
        scene.add(new THREE.DirectionalLight(0xd0e0ff, 1.0)).position.set(-5, 3, 3);

        let currentModel = null, audioContext, analyser, audioBuffer, mediaStreamDest, dataArray, sourceNode, startTime = 0, pauseTime = 0;

        function resize() {
            const parent = ui.container.parentElement;
            const aspect = state.resolution.w / state.resolution.h;
            if (parent.clientWidth / parent.clientHeight > aspect) {
                ui.container.style.height = '88vh'; ui.container.style.width = `calc(88vh * ${aspect})`;
            } else {
                ui.container.style.width = '88vw'; ui.container.style.height = `calc(88vw / ${aspect})`;
            }
            camera.aspect = aspect; camera.updateProjectionMatrix();
            renderer.setSize(state.resolution.w, state.resolution.h);
        }
        window.addEventListener('resize', resize); resize();
        ui.res.addEventListener('change', e => { state.resolution = e.target.value === 'landscape' ? {w:1920, h:1080} : {w:1080, h:1920}; resize(); });
        ui.bg.addEventListener('input', e => scene.background.set(e.target.value));

        function centerAndFitModel() {
            if (!currentModel) return;
            ui.scale.value = 1; ui.posX.value = 0; ui.posY.value = 0; ui.posZ.value = 0;
            modelGroup.scale.set(1, 1, 1); modelGroup.position.set(0, 0, 0);

            const box = new THREE.Box3().setFromObject(currentModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            if (maxDim === 0) return;

            const fov = camera.fov * (Math.PI / 180);
            let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2)) * 1.4;
            camera.position.set(center.x, center.y + (size.y * 0.1), center.z + cameraZ);
            controls.target.set(center.x, center.y + (size.y * 0.2), center.z);
            camera.far = cameraZ * 10; camera.updateProjectionMatrix(); controls.update();
        }
        ui.centerBtn.addEventListener('click', centerAndFitModel);

        ui.glb.addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            ui.info.innerHTML = "Loading & Parsing 3D Model...";
            
            const url = window.URL.createObjectURL(file);
            new GLTFLoader().load(url, gltf => {
                if (currentModel) modelGroup.remove(currentModel);
                currentModel = gltf.scene;
                modelGroup.add(currentModel);
                
                state.morphMeshes = []; state.bones = {}; state.initialBones = {};
                
                currentModel.traverse(node => {
                    if (node.isMesh && node.morphTargetDictionary) state.morphMeshes.push(node);
                    if (node.isBone) {
                        const n = node.name.toLowerCase();
                        if (n.includes('hips') || n.includes('pelvis')) state.bones.hips = node;
                        else if (n.includes('spine2') || n.includes('chest')) state.bones.chest = node;
                        else if (n.includes('spine') && !n.includes('1') && !n.includes('2')) state.bones.spine = node;
                        else if (n.includes('neck')) state.bones.neck = node;
                        else if (n.includes('head') && !n.includes('top')) state.bones.head = node;
                        else if (n.includes('leftshoulder') || n.includes('shoulder_l') || n.includes('clavicle_l')) state.bones.lShoulder = node;
                        else if (n.includes('rightshoulder') || n.includes('shoulder_r') || n.includes('clavicle_r')) state.bones.rShoulder = node;
                        else if (n.includes('leftarm') || n.includes('arm_l') || n.includes('upperarm_l')) state.bones.lArm = node;
                        else if (n.includes('rightarm') || n.includes('arm_r') || n.includes('upperarm_r')) state.bones.rArm = node;
                        else if (n.includes('leftforearm') || n.includes('forearm_l') || n.includes('elbow_l')) state.bones.lFore = node;
                        else if (n.includes('rightforearm') || n.includes('forearm_r') || n.includes('elbow_r')) state.bones.rFore = node;
                        else if (n.includes('lefthand') || n.includes('hand_l') || n.includes('wrist_l')) state.bones.lHand = node;
                        else if (n.includes('righthand') || n.includes('hand_r') || n.includes('wrist_r')) state.bones.rHand = node;
                        else if (n.includes('lefteye') || n.includes('eye_l')) state.bones.lEye = node;
                        else if (n.includes('righteye') || n.includes('eye_r')) state.bones.rEye = node;

                        state.initialBones[node.name] = { q: node.quaternion.clone(), p: node.position.clone() };
                    }
                });

                ui.info.innerHTML = `<span class="success">Model Ready! Switch to Timeline Tab to animate.</span>`;
                ui.centerBtn.disabled = false; centerAndFitModel();
                if(audioBuffer) ui.rec.disabled = false;
                window.URL.revokeObjectURL(url);
            });
        });

        ui.audio.addEventListener('change', async e => {
            const arrayBuffer = await e.target.files[0].arrayBuffer();
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.decodeAudioData(arrayBuffer, buffer => {
                audioBuffer = buffer; analyser = audioContext.createAnalyser();
                analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.6;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                mediaStreamDest = audioContext.createMediaStreamDestination();
                ui.play.disabled = false; if(currentModel) ui.rec.disabled = false;
            });
        });

        ui.play.addEventListener('click', async () => {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') await audioContext.resume();
            if (state.isPlaying) {
                if (sourceNode) { sourceNode.stop(); pauseTime = audioContext.currentTime - startTime; }
                state.isPlaying = false; ui.play.innerText = 'Play Audio';
            } else {
                sourceNode = audioContext.createBufferSource(); sourceNode.buffer = audioBuffer;
                sourceNode.connect(analyser); analyser.connect(audioContext.destination); analyser.connect(mediaStreamDest);
                sourceNode.start(0, pauseTime); startTime = audioContext.currentTime - pauseTime;
                state.isPlaying = true; ui.play.innerText = 'Pause Audio';
                sourceNode.onended = () => { if (state.isPlaying) { state.isPlaying = false; pauseTime = 0; ui.play.innerText = 'Play Audio'; if (state.isRecording) stopRecording(); } };
            }
        });

        // --- MATH HELPERS ---
        function cleanName(n) { return n.toLowerCase().replace(/[^a-z0-9]/g, ''); }
        
        function setMorphUniversal(mesh, searchNames, value, speed = 0.4) {
            if (!mesh.morphTargetDictionary) return;
            const keys = Object.keys(mesh.morphTargetDictionary);
            for (const search of searchNames) {
                const cleanSearch = cleanName(search);
                for (const key of keys) {
                    const cleanKey = cleanName(key);
                    if (cleanKey === cleanSearch || (cleanSearch.length > 2 && cleanKey.includes(cleanSearch))) {
                        const idx = mesh.morphTargetDictionary[key];
                        mesh.morphTargetInfluences[idx] = THREE.MathUtils.lerp(mesh.morphTargetInfluences[idx], Math.min(value, 1.0), speed);
                        break; 
                    }
                }
            }
        }

        // --- POSE ENGINE ---
        // Slerps a bone towards a target Euler rotation (relative to its initial rest pose)
        function slerpBoneToPose(bone, eulerArray, speed = 0.05) {
            if (!bone || !state.initialBones[bone.name] || !eulerArray) return;
            const targetOffsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(eulerArray[0], eulerArray[1], eulerArray[2]));
            const targetWorldQ = state.initialBones[bone.name].q.clone().multiply(targetOffsetQ);
            bone.quaternion.slerp(targetWorldQ, speed);
        }

        function applyAdditiveProcedural(bone, x, y, z) {
            if (!bone) return;
            const offsetQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(x, y, z));
            bone.quaternion.multiply(offsetQ); // Multiply on top of current slerped pose
        }

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            state.time += delta;
            const t = state.time;

            if (currentModel) {
                modelGroup.scale.setScalar(parseFloat(ui.scale.value));
                modelGroup.position.set(parseFloat(ui.posX.value), parseFloat(ui.posY.value), parseFloat(ui.posZ.value));
            }

            // Audio Tracking
            let vocalEnergy = 0, highEnergy = 0;
            if (state.isPlaying && analyser) {
                state.audioTime = audioContext.currentTime - startTime;
                ui.timeDisp.innerText = `Time: ${state.audioTime.toFixed(1)}s`;
                
                analyser.getByteFrequencyData(dataArray);
                for (let i = 2; i < 20; i++) vocalEnergy += dataArray[i];
                vocalEnergy = (vocalEnergy / 18) / 255;
                for (let i = 20; i < 60; i++) highEnergy += dataArray[i];
                highEnergy = (highEnergy / 40) / 255;
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, vocalEnergy, 0.15);
            } else {
                state.speechEnergy = THREE.MathUtils.lerp(state.speechEnergy, 0, 0.1);
            }

            // --- TIMELINE EVALUATION ---
            let activePoseName = state.timeline[0].pose;
            for(let i=0; i < state.timeline.length; i++) {
                if (state.audioTime >= state.timeline[i].time) {
                    activePoseName = state.timeline[i].pose;
                }
            }
            state.currentPoseName = activePoseName;

            const targetPose = PoseLibrary[state.currentPoseName];
            const slerpSpeed = 0.04; // Adjust for snappier or smoother transitions

            // Slerp Body to Target Pose
            if (currentModel && targetPose) {
                slerpBoneToPose(state.bones.lShoulder, targetPose.lShoulder, slerpSpeed);
                slerpBoneToPose(state.bones.rShoulder, targetPose.rShoulder, slerpSpeed);
                slerpBoneToPose(state.bones.lArm, targetPose.lArm, slerpSpeed);
                slerpBoneToPose(state.bones.rArm, targetPose.rArm, slerpSpeed);
                slerpBoneToPose(state.bones.lFore, targetPose.lFore, slerpSpeed);
                slerpBoneToPose(state.bones.rFore, targetPose.rFore, slerpSpeed);
                slerpBoneToPose(state.bones.lHand, targetPose.lHand, slerpSpeed);
                slerpBoneToPose(state.bones.rHand, targetPose.rHand, slerpSpeed);

                // PROCEDURAL LIFE LAYER (Applied on top of the fixed pose so avatar feels alive)
                const breath = Math.sin(t * 1.8) * 0.015;
                const swayX = Math.sin(t * 0.4) * 0.02;
                
                slerpBoneToPose(state.bones.spine, [0,0,0], 1.0); // Reset base
                applyAdditiveProcedural(state.bones.spine, breath, 0, swayX);
                
                slerpBoneToPose(state.bones.chest, [0,0,0], 1.0);
                applyAdditiveProcedural(state.bones.chest, breath * 1.5, 0, swayX * 0.5);

                const nod = (Math.sin(t * 3) * 0.02 * state.speechEnergy) + (breath * 0.5);
                slerpBoneToPose(state.bones.neck, [0,0,0], 1.0);
                applyAdditiveProcedural(state.bones.neck, nod + state.currentEyePos.y * 0.2, state.currentEyePos.x * 0.3, -swayX);
                
                slerpBoneToPose(state.bones.head, [0,0,0], 1.0);
                applyAdditiveProcedural(state.bones.head, nod + state.currentEyePos.y * 0.3, state.currentEyePos.x * 0.4, 0);

                if (state.bones.hips && state.initialBones[state.bones.hips.name]) {
                    const shiftX = Math.sin(t * 0.4) * 0.01;
                    const initHips = state.initialBones[state.bones.hips.name];
                    state.bones.hips.position.set(initHips.p.x + shiftX, initHips.p.y, initHips.p.z);
                    
                    slerpBoneToPose(state.bones.hips, [0,0,0], 1.0);
                    applyAdditiveProcedural(state.bones.hips, 0, 0, -shiftX * 1.5);
                }

                // Add slight rhythmic movement to arms if they are explaining
                if (state.currentPoseName.includes('explain') && state.speechEnergy > 0.1) {
                    const chop = Math.sin(t * 5) * state.speechEnergy * 0.1;
                    applyAdditiveProcedural(state.bones.lFore, chop, 0, 0);
                    applyAdditiveProcedural(state.bones.rFore, chop, 0, 0);
                }
            }

            // Blinking & Eyes
            state.blinkTimer += delta;
            if (state.blinkTimer > state.nextBlinkTime) {
                const blinkProgress = state.blinkTimer - state.nextBlinkTime;
                if (blinkProgress < 0.05) state.isBlinkingNow = blinkProgress / 0.05; 
                else if (blinkProgress < 0.15) state.isBlinkingNow = 1.0 - ((blinkProgress - 0.05) / 0.10); 
                else {
                    state.isBlinkingNow = 0; state.blinkTimer = 0;
                    state.nextBlinkTime = Math.random() * 4.0 + 2.0; 
                }
            }

            if (t > state.nextSaccadeTime) {
                state.eyeTarget.x = (Math.random() - 0.5) * 0.4;
                state.eyeTarget.y = (Math.random() - 0.5) * 0.2;
                state.nextSaccadeTime = t + Math.random() * 2.5 + 0.5;
                if (state.blinkTimer < state.nextBlinkTime - 0.5) state.nextBlinkTime = state.blinkTimer; 
            }
            state.currentEyePos.lerp(state.eyeTarget, 0.1);

            if (currentModel) {
                slerpBoneToPose(state.bones.lEye, [0,0,0], 1.0);
                applyAdditiveProcedural(state.bones.lEye, state.currentEyePos.y, state.currentEyePos.x, 0);
                slerpBoneToPose(state.bones.rEye, [0,0,0], 1.0);
                applyAdditiveProcedural(state.bones.rEye, state.currentEyePos.y, state.currentEyePos.x, 0);
            }

            // Lip Sync
            const mouthMax = parseFloat(ui.mouthAmp.value);
            state.morphMeshes.forEach(mesh => {
                if (state.isPlaying) {
                    const jaw = vocalEnergy * 2.5 * mouthMax; 
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah'], jaw, 0.4);
                    setMorphUniversal(mesh, ['mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], highEnergy * mouthMax, 0.3);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.2 + (highEnergy * 0.4), 0.2);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], state.speechEnergy * 0.8, 0.2);
                } else {
                    setMorphUniversal(mesh, ['jawopen', 'mouthopen', 'visemeaa', 'vrcvaa', 'fclmtha', 'a', 'ah', 'mouthfunnel', 'visemeu', 'visemeo', 'vrcvoh', 'fclmtho', 'o', 'u', 'oo', 'pucker'], 0, 0.2);
                    setMorphUniversal(mesh, ['mouthsmileleft', 'mouthsmileright', 'smile', 'fclmthe', 'e', 'ee'], 0.05, 0.1);
                    setMorphUniversal(mesh, ['browinnerup', 'browouterup', 'browsup', 'surprised'], 0, 0.1);
                }
                
                setMorphUniversal(mesh, ['eyeblinkleft', 'blinkleft', 'eyecloseleft'], state.isBlinkingNow, 0.8); 
                setMorphUniversal(mesh, ['eyeblinkright', 'blinkright', 'eyecloseright'], state.isBlinkingNow, 0.8); 
                setMorphUniversal(mesh, ['blink', 'fcleyeclose', 'eyesclosed'], state.isBlinkingNow, 0.8); 
            });

            controls.update(); renderer.render(scene, camera);
        }
        animate();

        // --- EXPORT ---
        let mediaRecorder, chunks = [];
        ui.rec.addEventListener('click', () => state.isRecording ? stopRecording() : startRecording());

        function startRecording() {
            chunks = [];
            const stream = new MediaStream([...renderer.domElement.captureStream(60).getVideoTracks(), ...(mediaStreamDest ? mediaStreamDest.stream.getAudioTracks() : [])]);
            const opts = ['video/webm;codecs=vp9,opus', 'video/mp4'].find(o => MediaRecorder.isTypeSupported(o)) || '';
            mediaRecorder = new MediaRecorder(stream, { mimeType: opts, videoBitsPerSecond: 10000000 });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
            mediaRecorder.onstop = () => {
                const url = URL.createObjectURL(new Blob(chunks, { type: mediaRecorder.mimeType }));
                const a = document.createElement('a'); a.href = url;
                a.download = `avatar_video.${opts.includes('mp4') ? 'mp4' : 'webm'}`;
                a.click(); URL.revokeObjectURL(url);
            };
            mediaRecorder.start(); state.isRecording = true;
            ui.rec.innerText = 'Stop & Export'; ui.rec.style.backgroundColor = '#6c757d';
            if (!state.isPlaying && audioBuffer) ui.play.click();
        }
        function stopRecording() {
            if (mediaRecorder) mediaRecorder.stop();
            state.isRecording = false; ui.rec.innerText = 'Record & Export Video'; ui.rec.style.backgroundColor = 'var(--danger-color)';
        }

        ui.theme.addEventListener('click', () => document.body.setAttribute('data-theme', document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
    </script>
</body>
